---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  namespace: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "${SECRET_CLOUDFLARE_EMAIL}"
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - selector:
          dnsZones:
            - ${SECRET_DEV_DOMAIN}
            - ${SECRET_LENAXIA_DOMAIN}
            - ${SECRET_PROD_DOMAIN_KF}
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
      - selector:
          dnsZones:
            - ${SECRET_SAFESPACES_DOMAIN}
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-safespaces-api-token
              key: api-token
