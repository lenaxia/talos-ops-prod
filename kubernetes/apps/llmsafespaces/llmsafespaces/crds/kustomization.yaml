---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Out-of-band CRD apply (Helm 3 does not upgrade crds/ on HelmRelease
# upgrades; helm-release.yaml sets upgrade.crds: Skip). Sourced from the
# chart's crds/ at the pinned tag — keep in sync with the GitRepository
# ref in kubernetes/flux/repositories/git/llmsafespaces.yaml.
#
# v0.26.0: workspace.yaml adds status.secretsDelivery (spawnedRev /
# degradedReason / filesRev — US-70.1 terminal verification, design 0057).
# Additive and optional; safe to apply before the chart upgrade.
# v0.27.0: workspace.yaml REMOVES status.userCredsPresent (dead field —
# nothing in 0.27.0 writes it; the controller's agentd scrape feeds
# secretsDelivery now). Superset-safe either direction, but synced per
# the lockstep doctrine.
# v0.34.7: workspace.yaml adds status.secretsDelivery.relayRevision (string,
# optional) — US-72.4 relay-only token emission lineage. Additive and
# optional; safe to apply before the chart upgrade (the v0.26.0 precedent).
# v0.44.17: workspace.yaml adds spec.harness (string, enum opencode/pi,
# bind-once) + spec.agentdDelivery + status.agentSupervisor. Additive, but
# NOT optional in practice: the 0.44.17 controller backfills spec.harness on
# legacy workspaces and new creations bind the harness at first session —
# with the pre-0.44.15 CRD those writes fail ("unknown field spec.harness")
# and new workspaces wedge in Creating with HarnessBindingPending. Synced
# after the v0.44.17 chart upgrade went out first (2026-11-18 incident).
resources:
  - workspace.yaml
