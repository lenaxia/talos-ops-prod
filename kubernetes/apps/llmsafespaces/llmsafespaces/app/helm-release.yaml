---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname llmsafespaces
  namespace: llmsafespaces
spec:
  interval: 15m
  chart:
    spec:
      # Chart is sourced from a GitRepository (kubernetes/flux/repositories/git/
      # llmsafespaces.yaml). The chart isn't published to a Helm/OCI registry.
      chart: ./helm
      sourceRef:
        kind: GitRepository
        name: llmsafespaces
        namespace: flux-system
      interval: 15m
      # `reconcileStrategy: Revision` is retained even though the GitRepository
      # is now pinned to a semver tag (current: v0.34.7). Rationale: if we ever move a
      # tag or point at a branch during an emergency rollback, ChartVersion
      # would refuse to re-package (Chart.yaml version wouldn't change). With
      # Revision, source-controller re-packages on every commit SHA change,
      # so the fallback path is safe. Worklog c914dc2e first set this;
      # PR-1d6975f9 (Epic 55) accidentally dropped it; PR-451 surfaced the
      # regression because its migration 000004 never reached the ConfigMap.
      reconcileStrategy: Revision
  install:
    # CRDs are installed by Helm from the chart's crds/ directory on initial
    # install only (`Create`). For upgrades, CRD schema changes must be
    # applied out-of-band — Helm 3 intentionally does not upgrade CRDs in
    # crds/ to prevent data loss on schema migrations. To keep both paths
    # consistent, we also set `crds.install: false` below so the chart does
    # NOT render CRDs from templates/ on every reconcile.
    crds: Create
    createNamespace: false
    remediation:
      retries: 5
  upgrade:
    # `Skip` here mirrors Helm 3's default behavior for `crds/`. If a chart
    # version ever requires a CRD schema change, apply the new CRDs from
    # the chart source manually, then bump the HelmRelease chart version.
    crds: Skip
    remediation:
      retries: 5
  # The chart's externalSecret block defaults to .create: true and will
  # render its own Secret. We pre-create llmsafespaces-credentials via
  # secret.sops.yaml and tell the chart to reference it instead.
  values:
    namespace:
      create: false

    # ── Migrations ──────────────────────────────────────────────────────────
    # PR #457 (closes LLMSafeSpaces#455) replaces the broken libpq KV form
    # with a /bin/sh -ec wrapper that percent-encodes DB_USER + DB_PASSWORD
    # and exec's migrate against a postgres:// URL — works with the
    # standalone CLI in migrate/migrate:v4.17.1.
    # Combined with PR #458's reconcileStrategy docs (LLMSafeSpaces#456)
    # and the chart-source reconcileStrategy: Revision below, the chart's
    # pre-upgrade migrate Job is safe to re-enable.
    # (Default for this value is `true` in the chart; the override is
    # removed entirely. Block kept for context — delete if/when the
    # narrative becomes irrelevant.)
    # Schema was advanced out-of-band on 2026-06-29 to v=4 (apply via
    # talos-ops-prod helm-release commit 34464313's mitigation path); the
    # re-enabled Job is a no-op against an already-current schema.

    # ── Datastores ──────────────────────────────────────────────────────────
    postgresql:
      host: llmsafespacespg-rw.databases.svc.cluster.local
      port: 5432
      user: llmsafespaces
      database: llmsafespaces
      sslMode: disable
    redis:
      host: llmsafespaces-valkey.llmsafespaces.svc.cluster.local
      port: 6379
      db: 0

    externalSecret:
      create: false
      existingSecret: llmsafespaces-credentials

    # The migrate Job uses the API image. The chart's `image.tag` default
    # falls back to Chart.AppVersion, but historically that field lagged the
    # actual published tags, so we always pin explicitly. As of 2026-07-06
    # (upstream v0.2.0+) the project cuts real semver releases and CI
    # publishes `<major>.<minor>.<patch>` OCI tags alongside the immutable
    # `ts-<unix>` tags. We pin to the semver — the GitRepository above is
    # pinned to the matching `tag: v0.8.0`, so the chart-source tree and
    # pinned to the matching `tag: v0.8.0`, so the chart-source tree and
    # the deployed images roll atomically. To upgrade, bump both the
    # GitRepository ref and every `image.tag` below in the same commit.
    # To verify a semver tag is present on ghcr:
    #   TOKEN=$(curl -sS 'https://ghcr.io/token?scope=repository%3Alenaxia%2Fllmsafespaces%2Fapi%3Apull&service=ghcr.io' | jq -r .token)
    #   curl -sH "Authorization: Bearer $TOKEN" \
    #     -H "Accept: application/vnd.oci.image.index.v1+json" \
    #     -o /dev/null -w "%{http_code}\n" \
    #     https://ghcr.io/v2/lenaxia/llmsafespaces/api/manifests/0.5.0
    #     https://ghcr.io/v2/lenaxia/llmsafespaces/api/manifests/0.8.0
    # ── Epic 66 Phase 1: per-workspace preview origins ────────────────────
    # <uuid>-preview.safespaces.dev hosts served by the API's dedicated
    # pipeline (owner bootstrap → one-time token → __Host-pv cookie).
    # IngressRoute + wildcard cert: PR #2301. Token secret key
    # preview-origin-token-secret in llmsafespaces-credentials (added in
    # 29fcafeb). NOTE: top-level values key — sibling of api:/controller:,
    # NOT nested under controller (the #2302 misplacement is why preview
    # hosts 404'd on the first 0.17.0 rollout).
    previewOrigin:
      enabled: true
      baseDomain: safespaces.dev
    api:
      replicaCount: 2
      image:
        tag: "0.34.7"
      # V2 delivery + agentd state authority — FIFTH FLIP (2026-09-05,
      # 0.27.0): the US-70 delivery pool ran fully green for the first
      # time under exactly these flags (delivery suite + revisions +
      # Epic 69 evidence incl. the authority park/unpark flip drill +
      # faults F1-F5, gVisor, 40-workspace scale — #1244 trail, LLMSafe
      # #1275). 0.27.0 carries what made V2 hold: file-class live
      # delivery (refresh_files, #1271), handler-enforced bootstrap-token
      # expiry (#1282), concurrent workspace reconciles (#1257), and the
      # F3 DEK semantics (#1280). The 2026-08-29 rollback reasons stand
      # resolved or accepted: #1119 promotion-await is bounded and the
      # pool's F2 partition row exercises it; indicators/transcript UX
      # shipped since. AGENTD_STATE_AUTHORITY rides the same wiring (the
      # outbox/terminus stack only wires under V2; the flip drill's
      # Park/Unpark/inflight admin endpoints are live under it).
      # Flip history: 4x on/off 2026-08-29 (0.25.5/0.25.7 era).
      extraEnv:
        - name: OPENCODE_V2_DELIVERY
          value: "1"
        - name: AGENTD_STATE_AUTHORITY
          value: "1"
      config:
        security:
          allowedOrigins:
            - https://chat.safespaces.dev
          allowCredentials: true

    controller:
      replicaCount: 1
      # Same semver-tag policy as api.image.tag above.
      image:
        tag: "0.34.7"
      # #1257: fleet resume was linear at the default 1 concurrent
      # reconcile (~8s/workspace). 4 is the product default; plenty for
      # a solo-operator fleet.
      maxConcurrentReconciles: 4
      # ── v0.34.7 relay-only key delivery posture flip ──────────────────────
      # relayOnlyKeyDelivery (design 0058) is default-on in 0.12.5+99aa346 and
      # its render guard REFUSES rbac.scope=cluster: the cluster grant's
      # informer-cache Secret read would replicate the llm-relay HPKE keypair
      # into controller memory (§4.3 no-read guarantee). Namespace scope needs
      # the cache scoped too — controller-runtime defaults to cluster-wide
      # informers when --watch-namespaces is unset (the old reason we ran
      # scope=cluster; see the RBAC block below). Pinning the watch to the
      # release namespace scopes every informer; storageclasses keep their
      # always-created read-only ClusterRole and RuntimeEnvironment stays
      # webhook-only (no informer, no RBAC need).
      watchNamespaces: "llmsafespaces"
      # ── Agentd overlay delivery (LLMSafeSpaces #863) ───────────────────────
      # Deliver workspace-agentd to workspace pods via a digest-pinned
      # read-only image volume instead of the binary baked into
      # runtimes/base. The per-arch binary sha256s resolve at controller
      # startup from the image index annotations (stamped by CI's
      # merge-agentd job) — do NOT set binarySHA256*.
      # Digest source: release v0.34.7 — Release workflow canonical print (run on 99aa3460);
      # verified by authenticated digest-GET (200).
      agentdSidecar:
        enabled: true
      agentdDelivery:
        image: ghcr.io/lenaxia/llmsafespaces/agentd@sha256:ee48a73cf8a7bf89cfddcf20ecb1bc53a069eec544786626605e7b56a00f7491
      # ── Opencode overlay delivery (design 0053 §4.2, MANDATORY) ───────────
      # 0.26.0 strips opencode out of runtimes/base; the controller
      # mounts this digest-pinned image volume at /opencode and the
      # supervisor sha256-verifies before spawn (exit 83/84 →
      # OpencodeVerified condition). Render fails without it — by design.
      # Digest source: release v0.34.7 — Release workflow canonical print; digest-GET verified 200.
      opencodeDelivery:
        image: ghcr.io/lenaxia/llmsafespaces/opencode@sha256:9fba17746314f76d0bbe11da2cb03f449a5381ff6e263d0efcd27cc30a2f6004
      # InferenceRelay DISABLED at v0.34.7 (2026-09-22): the InferenceRelay
      # CRD is cluster-scoped and its RBAC exists ONLY inside the opt-in
      # rbac.scope=cluster block — which the relay-only guard above now
      # refuses. With enable-inference-relay=true under namespace scope the
      # reconciler's cluster-wide CRD watch would forbidden-flood (the exact
      # failure class this file's old RBAC comment documented). The router
      # was inert anyway: no InferenceRelay CR, no fleet VMs, 503 on every
      # free-model call. Re-enable only when the fleet is actually
      # provisioned AND the chart ships a namespace-mode inferencerelays
      # grant (upstream issue filed); SetupRelayController is a no-op when
      # disabled, so nothing else changes.
      inferenceRelay:
        enabled: false
        # Chart default tag falls back to Chart.AppVersion; pinning explicitly
        # keeps the five images rolling atomically with the chart source.
        # (Historical note: relay-router used to lag because the per-image
        # build matrix was opt-in; that's no longer the case — every CI run
        # on main and every release tag builds all five.)
        router:
          image:
            tag: "0.34.7"
      freeModelsRefresher:
        enabled: false

    # ── RBAC ────────────────────────────────────────────────────────────────
    # FLIPPED cluster→namespace at v0.34.7 (2026-09-22). History: we ran
    # scope=cluster because the chart's namespace mode pre-Epic-17 mixed
    # cluster-scoped needs into one grant, and because controller-runtime's
    # informer cache watches cluster-wide when --watch-namespaces is unset
    # (worklog 0117). Post-G5 the chart splits grants correctly (secrets/
    # pods ALWAYS namespace-scoped; storageclasses read-only ClusterRole
    # always created), and controller.watchNamespaces=llmsafespaces (above)
    # scopes the cache — so namespace mode is now both supported and the
    # ONLY mode compatible with default-on relayOnlyKeyDelivery (its guard
    # refuses cluster: cluster-wide Secret read would defeat design 0058
    # §4.3). Namespace mode drops the inferencerelays grant; see the
    # inferenceRelay block above for why that's acceptable today.
    rbac:
      create: true
      scope: namespace

    # gVisor is not preinstalled on the Talos workers, but user namespaces
    # are now enabled on workers (patches/worker/userns.yaml) and the US-70
    # pool provisions runsc into its kind nodes — so runsc-based sandboxes
    # DO work on this cluster when provisioned. Default still runc for the
    # in-cluster deployment; multi-tenant hardening is documented in chart
    # values. (Updated 2026-09-03 — the old "gVisor cannot run here" note
    # predated the userns fix; see LLMSafeSpaces#1244 thread.)
    gvisor:
      enabled: false

    # CRDs are installed by Helm from the chart's crds/ directory
    # (install.crds: Skip in the HelmRelease spec — see top of file). We
    # set this to false so the chart does NOT also render CRDs from
    # templates/ on every reconcile, which would cause a fight between
    # Helm's CRD installer and the templated objects.
    crds:
      install: false

    # ── Webhooks ────────────────────────────────────────────────────────────
    # Requires cert-manager. The chart creates a self-signed Issuer unless
    # we point it at an existing one. Self-signed is fine for the webhook
    # CA — cert-manager just needs to be installed (which it is, see
    # README-LLM § cert-manager).
    webhooks:
      enabled: true
      issuerKind: Issuer
      failurePolicy: Fail

    # ── Network policies ────────────────────────────────────────────────────
    # The chart ships default-deny ingress + DNS-allow egress for workspace
    # pods. Cilium honors NetworkPolicy CRs so leave this on.
    networkPolicy:
      enabled: true

    datastore:
      networkPolicy:
        # We don't run postgres or valkey with the chart's expected pod
        # labels (the chart looks for app=postgres / app=valkey). Disable
        # the chart's datastore policy and rely on the dedicated CNPG
        # cluster + dedicated Valkey StatefulSet being scoped to this
        # namespace already.
        enabled: false

    # ── Frontend ────────────────────────────────────────────────────────────
    # Enable the frontend deployment, but disable its built-in Ingress —
    # we render a Traefik Ingress separately (ingress-frontend.yaml) so we
    # can apply this cluster's standard middleware chain + cert-manager
    # annotations consistently with every other app in the repo.
    frontend:
      enabled: true
      replicaCount: 1
      # Pinned to the same semver as api/controller/relay-router/base — the
      # platform rolls atomically because kind/slug wire format, CRD
      # schema (v0.27.0 removed status.userCredsPresent; secretsDelivery
      # stays), and DB migrations must all be in lockstep. The upstream
      # release-tag build produces `frontend:<same semver>` alongside the
      # other four images.
      image:
        tag: "0.34.7"
      apiBaseUrl: https://api.safespaces.dev/api/v1
      ingress:
        enabled: false

    # ── MCP server ──────────────────────────────────────────────────────────
    # Disabled — we don't expose MCP from this deployment. When off, the
    # chart renders neither the mcp Deployment nor the Service.
    mcp:
      enabled: false

    # ── Workspace runtime images ────────────────────────────────────────────
    # The chart seeds a `base` RuntimeEnvironment CR pointing at the base
    # workspace runtime image. Same semver pinning as api/controller/etc —
    # release-tag builds publish `base:0.5.0` alongside the other four.
    # release-tag builds publish `base:0.8.0` alongside the other four.
    runtimeEnvironments:
      base:
        image:
          # CalVer (design 0053 D5/S4): the base is content-versioned on
          # its own cadence (catalog seed: api/internal/imagefactory/
          # catalog.seed.yaml) and NEVER follows the platform VERSION —
          # base:0.26.0 does not exist and caused fleet-wide
          # ImagePullBackOff on every workspace pod recycle (2026-09-01).
          tag: "2026.08.0"

    # ── Workspace defaults ──────────────────────────────────────────────────
    # Pin workspace PVCs to the 2-replica Longhorn StorageClass. Chart
    # v0.2.2 (LLMSafeSpaces PR #509) exposes this as a Helm-managed value:
    # when set, the API pins the `workspace.defaultStorageClass` instance
    # setting via SetHelmOverrides — admins cannot silently override via
    # the settings UI (returns 409). See the 2026-07-07 workspace-stuck-in-
    # creating incident: cluster ran all workspace PVCs at 3r, exhausting
    # Longhorn's 25% MinimalAvailable threshold on every worker disk. The
    # `longhorn-2r` SC (talos-ops-prod PR #1976) provides a lower-durability
    # target for ephemeral workspaces — user data is already backed by
    # opencode's git-based history + external MCP secrets, so a single
    # replica loss during eviction is recoverable, not catastrophic.
    workspace:
      defaultStorageClass: longhorn-2r

    # ── Image Factory (design/0046, v0.8.0) ────────────────────────────────
    # The image factory lets users create custom workspace images by
    # selecting extensions from an operator-curated catalog. The API
    # renders a Dockerfile and dispatches a GitHub Actions build.
    #
    # To enable builds: create a Secret with a GitHub PAT (needs repo +
    # workflow scopes on the LLMSafeSpaces repo) and reference it below.
    # Without the token, POST /configs returns 503 (graceful degradation —
    # catalog and settings page still work for browsing).
    #
    #   kubectl -n llmsafespaces create secret generic image-factory-gh-token \
    #     --from-literal=gh-token='ghp_xxx'
    #
    # The LLM explainer key is optional — without it, build failures use
    # a fallback string instead of an LLM-generated explanation.
    imageFactory:
      imageRepo: "ghcr.io/lenaxia/llmsafespaces-images/ws"
      callbackURL: "https://api.safespaces.dev/internal/image-factory"
      ghDispatcher:
        owner: "lenaxia"
        repo: "llmsafespaces-images"
        workflowId: "image-build.yml"
        ref: "main"
        appCredentials:
          secretName: "image-factory-app-credentials"
          appIdKey: "app-id"
          privateKeyKey: "app-private-key"
      llmExplainer:
        baseUrl: ""
        model: ""

    # ── Inference relay ─────────────────────────────────────────────────────
    # The chart's DEFAULT inferenceRelayURL is `https://relay.safespaces.dev`
    # — that's the chart author's own CF Worker, NOT ours. Override to empty
    # so workspace pods don't hit a relay we don't control. With
    # controller.inferenceRelay.enabled: true above and this left empty, the
    # chart derives the cross-namespace FQDN
    #   http://relay-router.llmsafespaces.svc.cluster.local:8080
    # for workspace pods to reach the in-cluster router. Until an
    # InferenceRelay CR is created and peers are healthy, the router has no
    # backends and free-model inference will 503 (acceptable for the
    # router-only stage — no fleet provisioned yet).
    inferenceRelayURL: ""

    # ── Relay-only key delivery rollback (LLMSafeSpaces #1548) ─────────────
    # TEMPORARY builder-only rollback (2026-09-23). Chart 0.12.5 defaults
    # relayOnlyKeyDelivery.enabled=true and the API half (token-only
    # emission) is live — but the deployed controller 0.34.7 image never
    # runs its staging pass: the flag is present in the pod spec yet there
    # is no startup "relay-only key delivery enabled" line, zero router
    # traffic, and zero workspace-relay-* handoff Secrets cluster-wide.
    # The batch builder then fails closed (relay_staging_not_ready): every
    # workspace with bound llm-provider credentials receives ZERO llm
    # entries (observed on d8bed486 — thekaocloud gone, default model
    # unresolvable; refreshing is a no-op because the rebuilt batch is
    # equally empty).
    # api.enabled=false is the chart's designed narrow lever
    # (templates/api-deployment.yaml): raw-key delivery resumes on the
    # next resync/bootstrap while controller staging and the llm-relay
    # router stay up. REVERT this block once #1548's root cause is fixed
    # — controller emits the enable line and the first
    # workspace-relay-* handoff appears — then flip api.enabled back to
    # true.
    relayOnlyKeyDelivery:
      api:
        enabled: false

    # ── Subdomain routing ───────────────────────────────────────────────────
    # Disabled — single-host frontend per design call. If we ever want
    # per-org SSO subdomain routing, flip this on and add a wildcard cert.
    orgSubdomainRouting:
      enabled: false

    # ── Monitoring ──────────────────────────────────────────────────────────
    # The cluster runs kube-prometheus-stack with sidecar dashboard import.
    # The chart's defaults work as-is — opt in.
    monitoring:
      enabled: true
      dashboards:
        enabled: true
        labels:
          grafana_dashboard: "1"
      datasources:
        enabled: false   # we already have a postgres datasource via the operator
      prometheusRules:
        enabled: true
      serviceMonitors:
        enabled: true
        # The chart's agentd PodMonitor template uses `endpoints:` instead
        # of `podMetricsEndpoints:` — `endpoints` is the ServiceMonitor
        # field name; PodMonitor has always used `podMetricsEndpoints`.
        # Prometheus Operator's strict CRD validation rejects it.
        # Disable until upstream fixes the template.
        agentdPodMonitor:
          enabled: false
