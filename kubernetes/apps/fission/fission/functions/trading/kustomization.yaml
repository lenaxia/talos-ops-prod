# Trading functions (shadow mode): Package + Function CRs.
# Ported from lenaxia/functions deploy/trading — see README.md here for the
# deploy/finish checklist (secrets are sops-encrypted, listed below only
# after they exist).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fission
resources:
  - ./packages.yaml
  - ./functions.yaml
