---
# Fission Functions for the trading system.
#
# All newdeploy (matriarch convention). MinScale 0: steps cold-start on
# trigger; the morning chain tolerates it (debate budget 40 min).
#
# functionTimeout values (seconds) cover the step budgets:
#   debate 2400 (40 min LLM) | decide 480 | execute 300 | score 900 |
#   digest 120 | morning-chain 3480 (sum + slack) | afternoon-chain 1140 |
#   reconcile 300 | status 60
#
# idletimeout (seconds) must EXCEED functionTimeout: the newdeploy idle
# reaper (pkg/executor/reaper/idle, default 2m) scales deployments to
# MinScale when no NEW request taps the function for idletimeout — it
# does NOT track in-flight requests. A single long-running chain request
# (>2m) was being reaped mid-flight on 10/20 + 10/21 (debate/decide ran,
# execute never invoked). idletimeout = functionTimeout + 120s buffer so
# a max-length request can never be reaped while still running; pods
# still scale to zero afterwards.
#
# All functions mount the single shared `trading` secret (one sops
# file; see secret-trading.yaml.template).
apiVersion: fission.io/v1
kind: Function
metadata:
  name: debate
  namespace: fission
spec:
  environment:
    name: python3-trading
    namespace: fission
  package:
    packageref:
      name: debate
      namespace: fission
    functionName: main
  secrets:
    - name: trading
      namespace: fission
  functionTimeout: 2400
  idletimeout: 2520
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: newdeploy
      MinScale: 0
      MaxScale: 1
      SpecializationTimeout: 240
