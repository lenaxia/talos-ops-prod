---
# Fission Packages for the trading functions.
# URL versions pair with functions/<fn>/config.yaml version bumps (pinned
# per-function release model — bump both together, always).
apiVersion: fission.io/v1
kind: Package
metadata:
  name: debate
  namespace: fission
spec:
  environment:
    name: python3-trading
    namespace: fission
  deployment:
    type: url
    url: https://github.com/lenaxia/functions/releases/download/debate-0.1.3/debate-0.1.3.zip
