---
# Fission Packages for the trading functions.
# URLs pin the 0.1.0 release zips from this repo's releases (per-function
# release model; version bumps here pair with config.yaml bumps).
apiVersion: fission.io/v1
kind: Package
metadata:
  name: debate
  namespace: fission
spec:
  environment:
    name: python3-trading
    namespace: fission
  deployment:
    type: url
    url: https://github.com/lenaxia/functions/releases/download/debate-0.1.0/debate-0.1.0.zip
