---
# HTTP routes (manual/ops invocation, imaizumi style) + TimeTriggers.
#
# Schedules (UTC, weekdays — mirror the ai-trading GHA cadence with the
# mission's offsets):
#   morning-chain   13:45 (debate -> decide -> execute, just after US open)
#   afternoon-chain 22:30 (score -> digest, after the US close + scoreboard)
#   reconcile       22:50 (DB vs Alpaca drift + schedule watchdog)
apiVersion: fission.io/v1
kind: HTTPTrigger
metadata:
  name: debate
  namespace: fission
spec:
  functionref:
    name: debate
    type: name
  relativeurl: /debate
  methods:
    - GET
    - POST
---
apiVersion: fission.io/v1
kind: HTTPTrigger
metadata:
  name: decide
  namespace: fission
spec:
  functionref:
    name: decide
    type: name
  relativeurl: /decide
  methods:
    - GET
    - POST
