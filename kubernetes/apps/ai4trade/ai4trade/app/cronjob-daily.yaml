---
# Daily workflow (daily_run.py, no LLM): marketdata snapshot -> trade
# decision -> execute exits then two-layer-gated entries (DD veto from
# dd_verdicts.json + headline screen; max 2 trades/day) -> one platform
# post -> state/log. daily_run keeps its state under /data, so the same PVC
# is mounted twice: /workspace/ai4trade (legacy scripts) and /data (state
# root) — one volume, one source of truth.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai4trade-daily
  namespace: ai4trade
  labels:
    app.kubernetes.io/name: ai4trade
spec:
  schedule: '0 14 * * *'
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ai4trade
        spec:
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/worker: 'true'
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: daily
              image: ghcr.io/lenaxia/ai4trade:1.0.0
              args: ['daily']
              envFrom:
                - secretRef:
                    name: ai4trade-secret
                - configMapRef:
                    name: ai4trade-config
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: state
                  mountPath: /workspace/ai4trade
                - name: state
                  mountPath: /data
                - name: config
                  mountPath: /etc/ai4trade
                  readOnly: true
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: ai4trade-state
            - name: config
              configMap:
                name: ai4trade-config
