---
# Forward-tracker scoreboard (forward/forward.py): refetch daily OHLC, replay
# all out-of-sample variants, print the comparison JSON. 21:30 UTC Mon-Fri
# per forward/NOTES.md (after the US close, outside the 5-bar revision
# window's partial-bar risk).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai4trade-scoreboard
  namespace: ai4trade
  labels:
    app.kubernetes.io/name: ai4trade
spec:
  schedule: '30 21 * * 1-5'
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ai4trade
        spec:
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/worker: 'true'
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: scoreboard
              image: ghcr.io/lenaxia/ai4trade:1.0.0
              args: ['scoreboard']
              envFrom:
                - secretRef:
                    name: ai4trade-secret
                - configMapRef:
                    name: ai4trade-config
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: state
                  mountPath: /workspace/ai4trade
                - name: config
                  mountPath: /etc/ai4trade
                  readOnly: true
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: ai4trade-state
            - name: config
              configMap:
                name: ai4trade-config
