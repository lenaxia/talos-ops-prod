---
# Drawdown gate (dd_screen.py): TradingAgents deep-dive on trade.py buy
# candidates, veto-only. dd_screen needs the TradingAgents venv, which the
# base ai4trade image does not carry — the DD gate runs workspace-side until
# a TA-enabled image lands (this CronJob's image field may then differ from
# the rest of the stack). Suspended so the schedule exists but does not fire.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai4trade-ddgate
  namespace: ai4trade
  labels:
    app.kubernetes.io/name: ai4trade
spec:
  schedule: '45 13 * * 1-5'
  timeZone: UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ai4trade
        spec:
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/worker: 'true'
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: ddgate
              image: ghcr.io/lenaxia/ai4trade:1.0.0
              args: ['ddgate']
              envFrom:
                - secretRef:
                    name: ai4trade-secret
                - configMapRef:
                    name: ai4trade-config
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: state
                  mountPath: /workspace/ai4trade
                - name: config
                  mountPath: /etc/ai4trade
                  readOnly: true
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: ai4trade-state
            - name: config
              configMap:
                name: ai4trade-config
