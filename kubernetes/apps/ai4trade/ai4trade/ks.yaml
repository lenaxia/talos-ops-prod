---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ai4trade
  namespace: flux-system
spec:
  targetNamespace: ai4trade
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/ai4trade/ai4trade/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: cluster-storage-longhorn
  interval: 15m
  retryInterval: 1m
  timeout: 5m
