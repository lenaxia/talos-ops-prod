---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-postgres-secrets-labeled
  namespace: kyverno
  annotations:
    policies.kyverno.io/title: Sync Postgres Secrets (label-gated)
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      This policy will copy a secret called `postgres-superuser` which
      exists in the `databases` namespace to namespaces labeled
      `kao.family/db-secret-sync=true`. It will also push updates to the
      copied Secrets should the source secret be changed.
spec:
  mutateExistingOnPolicyUpdate: true
  rules:
    - name: sync-postgres-superuser-secret
      match:
        resources:
          kinds: ["Namespace"]
          selector:
            matchLabels:
              kao.family/db-secret-sync: "true"
      exclude:
        resources:
          namespaces: ["databases"]
      generate:
        generateExisting: true
        apiVersion: v1
        kind: Secret
        name: postgres-superuser
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        clone:
          namespace: databases
          name: postgres-superuser
