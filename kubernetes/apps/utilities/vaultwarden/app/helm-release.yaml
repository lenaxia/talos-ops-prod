apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vaultwarden
  namespace: utilities

spec:
  releaseName: *app
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 10m
  interval: 6m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
      securityContext:
        fsGroup: 568
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          main:
            image:
              repository: ghcr.io/dani-garcia/vaultwarden
              tag: 1.37.5

    # -- environment variables.
            envFrom:
              - secretRef:
                  name: &app vaultwarden
            env:
              DATA_FOLDER: config
              DOMAIN: https://vault.${SECRET_DEV_DOMAIN}
              ROCKET_PORT: 8080
              TZ: ${TIMEZONE}
              SIGNUPS_ALLOWED: false
              WEBSOCKET_ENABLED: true
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 568
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]

    service:
      main:
        type: ClusterIP

        ports:
          http:
            port: 8080
          websocket:
            port: 3012
            enabled: true
        primary: true
    ingress:
      main:
        enabled: true
        annotations:
          hajimari.io/enable: 'true'
          hajimari.io/visible-groups: 'bitwarden,administrators,kaofamily'
          hajimari.io/icon: shield-key
          hajimari.io/appName: 'Bitwarden'
          hajimari.io/info: 'Password Manager'
          hajimari.io/group: Utilities
          cert-manager.io/cluster-issuer: letsencrypt-production
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: 
            networking-chain-authelia@kubernetescrd
        hosts:
          - host: &uri vault.${SECRET_DEV_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
              - path: /notifications/hub/negotiate
                pathType: Prefix
                service:
                  identifier: main
                  port: http
              - path: /notifications/hub
                pathType: Prefix
                service:
                  identifier: main
                  port: websocket
        tls:
          - hosts:
              - *uri
            secretName: *uri
        className: traefik

    persistence:
      config:
        enabled: true
        existingClaim: vaultwarden-config-volume
        type: persistentVolumeClaim

