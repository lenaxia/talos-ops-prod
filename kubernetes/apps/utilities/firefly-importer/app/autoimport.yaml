# Nightly automated SimpleFIN import (data-importer CLI).
# The JSON template carries the account mapping from the original UI import.
# Two placeholders are injected at runtime by the initContainer:
#   __SIMPLEFIN_ACCESS_URL__  credential from the firefly-importer Secret
