---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-importer-autoimport
  namespace: utilities
spec:
  schedule: '40 2 * * *'
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/worker: 'true'
          initContainers:
            - name: render-config
              image: fireflyiii/data-importer:version-2.3.4
              command:
                - php
                - -r
                - >-
                  $d = (int)(getenv("IMPORT_WINDOW_DAYS") ?: 90);
                  file_put_contents("/import/simplefin.json",
                  str_replace(["__SIMPLEFIN_ACCESS_URL__", "__IMPORT_START_DATE__"],
                  [getenv("SIMPLEFIN_ACCESS_URL"), date("Y-m-d", strtotime("-$d days"))],
                  file_get_contents("/template/simplefin.json")));
              env:
                - name: SIMPLEFIN_ACCESS_URL
                  valueFrom:
                    secretKeyRef:
                      name: firefly-importer
                      key: SIMPLEFIN_ACCESS_URL
              volumeMounts:
                - name: template
                  mountPath: /template
                  readOnly: true
                - name: import
                  mountPath: /import
          containers:
            - name: import
              image: fireflyiii/data-importer:version-2.3.4
              command:
                - sh
                - -c
                - |
                  php artisan config:clear >/dev/null 2>&1
                  php artisan import:validate-json /import/simplefin.json
                  IMPORT_DIR_ALLOWLIST=/import php artisan importer:import /import/simplefin.json > /tmp/import.log 2>&1
                  tail -5 /tmp/import.log
                  # importer exits GENERAL_ERROR when Firefly rejects re-imported
                  # duplicates; success = the run reached "Done!"
                  grep -q 'Done!' /tmp/import.log
              env:
                - name: FIREFLY_III_URL
                  value: http://firefly-iii.utilities.svc.cluster.local:8080
                - name: FIREFLY_III_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: firefly-importer
                      key: FIREFLY_III_ACCESS_TOKEN
                - name: IMPORT_DIR_ALLOWLIST
                  value: /import
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: import
                  mountPath: /import
                  readOnly: true
          volumes:
            - name: template
              configMap:
                name: firefly-importer-autoimport
            - name: import
              emptyDir: {}
