---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app firefly-iii
  namespace: &namespace utilities
spec:
  releaseName: *app
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 10m
  interval: 6m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      main:
        type: deployment
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        initContainers:
          init-db:
            image:
              repository: ghcr.io/onedr0p/postgres-init
              tag: '17.4'
            env:
              - name: INIT_POSTGRES_SUPER_PASS
                valueFrom:
                  secretKeyRef:
                    name: postgres-superuser
                    key: password
            envFrom:
              - secretRef:
                  name: *app
        containers:
          main:
            image:
              repository: fireflyiii/core
              tag: version-6.6.6
            env:
              TZ: ${TIMEZONE}
              APP_ENV: production
              APP_DEBUG: 'false'
              APP_URL: https://firefly.${SECRET_DEV_DOMAIN}
              TRUSTED_PROXIES: '**'
              DB_CONNECTION: pgsql
              DB_PORT: '5432'
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: INIT_POSTGRES_HOST
              DB_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: INIT_POSTGRES_DBNAME
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: INIT_POSTGRES_USER
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: INIT_POSTGRES_PASS
              APP_KEY:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: APP_KEY
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false

    service:
      main:
        primary: true
        ports:
          http:
            port: 8080

    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          hajimari.io/enable: 'true'
          hajimari.io/icon: currency-usd
          hajimari.io/group: Utilities
          cert-manager.io/cluster-issuer: letsencrypt-production
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares:
            networking-chain-authelia@kubernetescrd
        hosts:
          - host: &uri firefly.${SECRET_DEV_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *uri
            secretName: *uri

    persistence:
      storage:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: longhorn
        retain: true
        globalMounts:
          - path: /var/www/html/storage
