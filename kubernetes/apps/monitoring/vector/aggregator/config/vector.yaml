sources:
  journald_source:
    type: vector
    version: "2"
    address: 0.0.0.0:6000
  kubernetes_source:
    type: vector
    version: "2"
    address: 0.0.0.0:6010
#  opnsense_source:
#    type: syslog
#    address: 0.0.0.0:5140
#    mode: udp
