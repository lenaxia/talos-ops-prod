transforms:
  kubernetes_remap:
    type: remap
    inputs:
      - kubernetes_source
    source: |
      # Standardize 'app' index
      # vector 0.57 kubernetes_logs metadata: labels live under .kubernetes.pod_labels
      .custom_app_name = .kubernetes.pod_labels."app.kubernetes.io/name" || .kubernetes.pod_labels.app || .kubernetes.pod_labels."k8s-app" || "unknown"
      # Flat fields for VictoriaLogs stream fields / LogsQL filters
      .app = .custom_app_name
      .namespace = .kubernetes.pod_namespace
      .node = .kubernetes.pod_node_name

