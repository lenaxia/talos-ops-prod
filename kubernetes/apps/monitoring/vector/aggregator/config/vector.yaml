sinks:
  # VictoriaLogs accepts the Elasticsearch bulk API at /insert/elasticsearch/
  # https://docs.victoriametrics.com/victorialogs/data-ingestion/vector/
  journald:
    type: elasticsearch
    inputs:
      - journald_source
    endpoints:
      - http://vlsingle-victoria-metrics.monitoring.svc.cluster.local:9428/insert/elasticsearch/
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: host,unit
  kubernetes:
    type: elasticsearch
    inputs:
      - kubernetes_remap
    endpoints:
      - http://vlsingle-victoria-metrics.monitoring.svc.cluster.local:9428/insert/elasticsearch/
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: app,namespace,node
      ignore_fields: custom_app_name,source_type,file,host
