---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - ./pod-monitor.yaml
  #  - ./prometheus-rule.yaml
configMapGenerator:
  # Local copies of upstream flux2 v0.37.0 dashboards with datasource refs
  # pinned to uid VictoriaMetrics/VictoriaLogs (upstream ships ${DS_PROMETHEUS}
  # / Loki refs, which broke when kube-prometheus-stack was removed).
  - name: flux-cluster-dashboard
    files:
      - flux-cluster-dashboard.json=./flux-cluster-dashboard.json
  - name: flux-control-plane-dashboard
    files:
      - flux-control-plane-dashboard.json=./flux-control-plane-dashboard.json
  - name: flux-logs-dashboard
    files:
      - flux-logs-dashboard.json=./flux-logs-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    grafana_dashboard: "true"
