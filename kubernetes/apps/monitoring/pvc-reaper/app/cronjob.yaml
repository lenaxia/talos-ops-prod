---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-reaper
  namespace: monitoring
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: pvc-reaper
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: reaper
              # kubectl + jq + yq, same minor as the cluster (1.36.x).
              image: alpine/k8s:1.36.2
              imagePullPolicy: IfNotPresent
              env:
                - name: NAMESPACES
                  value: monitoring
              command:
                - /bin/sh
                - -ec
                - |
                  NS="${NAMESPACES:-monitoring}"
                  reaped=0

                  # Nodes that are NOT Ready (covers Ready=False, Unknown, and
                  # missing condition). These are the hosts whose local PVCs
                  # can never be reattached and must be reaped.
                  NOTREADY="$(kubectl get nodes -o json \
                    | jq -r '[.items[]
                        | select(((.status.conditions // [])
                                  | map(select(.type=="Ready" and .status=="True"))
                                  | length) == 0)
                        | .metadata.name] | .[]')"

                  # PVC claims whose consuming pod currently fails to mount or
                  # attach a volume (FailedMount / FailedAttachVolume). This
                  # catches node-local PVCs that lost their backing path on a
                  # *Ready* node (e.g. host rebuilt, disk wiped) or that are
                  # pinned to a node the pod can no longer be scheduled onto.
                  # Only local (node-affinity) PVs are reaped below; networked
                  # CSI volumes are portable and are deliberately left alone.
                  STUCK_PVCS="$(kubectl get events -n "$NS" \
                      --field-selector type=Warning -o json 2>/dev/null \
                    | jq -r '[.items[]
                        | select(.reason=="FailedMount"
                                 or .reason=="FailedAttachVolume")
                        | .involvedObject.name] | .[]' \
                    | sort -u \
                    | while IFS= read -r pod; do
                        [ -z "$pod" ] && continue
                        kubectl -n "$NS" get pod "$pod" \
                          -o jsonpath='{range .spec.volumes[*]}{.persistentVolumeClaim.claimName}{"\n"}{end}' 2>/dev/null
                      done \
                    | grep -v '^$' | sort -u)"

                  if [ -z "$NOTREADY" ] && [ -z "$STUCK_PVCS" ]; then
                    echo "all nodes Ready and no stuck volume mounts; nothing to do"
                    exit 0
                  fi

                  [ -n "$NOTREADY" ] && { echo "not-ready nodes:"; echo "$NOTREADY"; }
                  [ -n "$STUCK_PVCS" ] && { echo "pvc claims with stuck mounts:"; echo "$STUCK_PVCS"; }

                  for ns in $NS; do
                    for pvc in $(kubectl -n "$ns" get pvc -o name 2>/dev/null); do
                      claim="$(kubectl -n "$ns" get "$pvc" -o jsonpath='{.metadata.name}')"
                      pv="$(kubectl -n "$ns" get "$pvc" -o jsonpath='{.spec.volumeName}')"
                      [ -z "$pv" ] && continue

                      # Resolve the node a local PV (openebs-hostpath etc.) is
                      # pinned to via its nodeAffinity. Networked PVs have no
                      # such affinity and are skipped.
                      node="$(kubectl get pv "$pv" -o json 2>/dev/null \
                        | jq -r '.spec.nodeAffinity.required.nodeSelectorTerms[]?
                                 .matchExpressions[]?
                                 | select(.key=="kubernetes.io/hostname")
                                 | .values[0]' 2>/dev/null | head -n1 || true)"
                      [ -z "$node" ] && continue

                      reap=0
                      if [ -n "$NOTREADY" ] && echo "$NOTREADY" | grep -qFx "$node"; then
                        echo "reaping $pvc in ns/$ns (pv=$pv pinned to not-ready node=$node)"
                        reap=1
                      elif [ -n "$STUCK_PVCS" ] && echo "$STUCK_PVCS" | grep -qFx "$claim"; then
                        echo "reaping $pvc in ns/$ns (pv=$pv on node=$node has stuck volume mount)"
                        reap=1
                      fi
                      if [ "$reap" = "1" ]; then
                        kubectl -n "$ns" delete "$pvc" --ignore-not-found >/dev/null \
                          && reaped=$((reaped+1))
                      fi
                    done
                  done

                  echo "done. reaped $reaped pvc(s)."
