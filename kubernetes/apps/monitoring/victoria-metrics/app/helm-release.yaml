---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-metrics
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.91.2
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
      interval: 15m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 6
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 6
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app

    # Operator converts existing ServiceMonitor/PodMonitor/PrometheusRule CRs
    # into VM* equivalents (disable_prometheus_converter defaults to false),
    # so vmagent reuses the scrape config already defined across the cluster.
    victoria-metrics-operator:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      upgradeJob:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"

    # External Grafana is deployed separately; dashboard ConfigMaps created by
    # the sync-job are labeled grafana_dashboard=1 and picked up by its sidecar.
    grafana:
      enabled: false

    # Pushover receiver + routes carried over from kube-prometheus-stack's
    # alertmanager at cutover. This is the sole pager now.
    alertmanager:
      enabled: true
      spec:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
        # persist silences/nflog across restarts
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname", "job"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
          receiver: "pushover"
          routes:
            - receiver: "null"
              matchers:
                - alertname =~ "InfoInhibitor|Watchdog|RebootScheduled"
            - receiver: "null"
              matchers:
                - severity = "info"
            - receiver: "pushover"
              matchers:
                - severity = "critical"
              continue: true
            - receiver: "pushover"
              matchers:
                - alertname =~ "KubeNodeNotReady|KubeNodeUnreachable|KubeNodeReadinessFlapping"
              continue: true
        receivers:
          - name: "null"
          - name: "pushover"
            pushover_configs:
              - url_title: View in Alert Manager
                token: "${SECRET_PUSHOVER_PROD_TOKEN}"
                user_key: "${SECRET_PUSHOVER_USER_KEY}"
                send_resolved: true
                html: true
                sound: gamelan
                priority: |-
                  {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
                title: |-
                  [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
                message: |-
                  {{- range .Alerts }}
                    {{- if ne .Labels.severity "" }}
                      <b>Severity:</b> <i>{{ .Labels.severity }}</i>
                    {{- else }}
                      <b>Severity:</b> <i>N/A</i>
                    {{- end }}
                    {{- if ne .Annotations.description "" }}
                      <b>Description:</b> <i>{{ .Annotations.description }}</i>
                    {{- else if ne .Annotations.summary "" }}
                      <b>Summary:</b> <i>{{ .Annotations.summary }}</i>
                    {{- else if ne .Annotations.message "" }}
                      <b>Message:</b> <i>{{ .Annotations.message }}</i>
                    {{- else }}
                      <b>Description:</b> <i>N/A</i>
                    {{- end }}
                    {{- if gt (len .Labels.SortedPairs) 0 }}
                      <b>Details:</b>
                      {{- range .Labels.SortedPairs }}
                        • <b>{{ .Name }}:</b> <i>{{ .Value }}</i>
                      {{- end }}
                    {{- end }}
                  {{- end }}
    vmalert:
      enabled: true
      spec:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
        evaluationInterval: 60s
        resources:
          requests:
            cpu: 100m
            memory: 256Mi

    external:
      grafana:
        host: grafana.${SECRET_DEV_DOMAIN}
        datasource: VictoriaMetrics

    vmagent:
      enabled: true
      spec:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
        scrapeInterval: 30s
        # No hostname pin. Request sized from observed 7d peak (~2.9GiB) so
        # the scheduler doesn't overpack a node — see vmsingle note.
        resources:
          requests:
            cpu: 400m
            memory: 3Gi

    vmsingle:
      enabled: true
      spec:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
        retentionPeriod: 90d
        # NOTE: no hostname pin, no memory limit — the scheduler can only pack
        # safely if the request is honest. Observed 7d peak working set is
        # ~6.7GiB; the old 2Gi request let the scheduler overpack worker-04
        # (2026-09-08 NotReady memory-exhaustion incident). Sized requests are
        # what make unpinned placement safe.
        resources:
          requests:
            cpu: 300m
            memory: 7Gi
        storage:
          # NOTE: live volume is 2-replica (verified in longhorn). SC `longhorn`
          # is 3-replica — on ANY volume recreation, switch this block to
          # storageClassName: longhorn-2r BEFORE the new PVC is created, or it
          # binds at 3 replicas (~200Gi extra we don't have). storageClassName
          # is immutable on PVCs — do not change while this PVC exists.
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi

    # Rule groups re-enabled at cutover (kube-prometheus-stack removed — its
    # converted rules no longer provide these).
    # alertmanager source stays disabled: on chart <=0.91.2 its selectors never
    # match our VMAlertmanager (fixed in 0.92.0). Re-enable after chart bump.
    # Kubelet/VMNodeScrape labelmaps ALL node labels onto every scraped
    # series (feature_node_*, beta_*, extensions_talos_dev_*, gpu_intel_*),
    # which blew up cardinality and made vmsingle reject rows with
    # "too_many_labels". Chart defaults + a labeldrop for the node noise.
    kubelet:
      vmScrape:
        spec:
          scheme: "https"
          honorLabels: true
          interval: "30s"
          scrapeTimeout: "5s"
          tlsConfig:
            insecureSkipVerify: true
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
            # drop node-metadata labels leaked by VMNodeScrape's labelmap
            - action: labeldrop
              regex: (beta_kubernetes_io_.*|kubernetes_io_arch|kubernetes_io_os|feature_node_.*|extensions_talos_dev_.*|gpu_intel_com_.*|intel_feature_node_.*|node_role_kubernetes_io_.*)
          relabelConfigs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet
          honorTimestamps: false

    defaultRules:
      # count:up0 recording rule is empty whenever nothing is down (normal
      # state), which made vmalert's RecordingRulesNoData fire forever.
      rules:
        "count:up0":
          enabled: false
      sources:
        alertmanager:
          enabled: false

    # Control-plane scrapes: chart defaults verify TLS against the service
    # account CA, which fails for the self-signed kube-scheduler/controller-
    # manager certs (TargetDown/InstanceUnreachable fired continuously until
    # this fix — matches kube-prometheus-stack's insecureSkipVerify behavior).
    # Talos runs etcd outside the API (no pods to select) but exposes
    # plain-HTTP metrics on :2381 (talos patch: listen-metrics-urls).
    # Helm deep-merges .service.selector with the chart default
    # (component=etcd, matches nothing on Talos), so use static control-
    # plane IPs instead — chart renders a manual Endpoints object.
    # Update IPs if control-plane nodes change.
    kubeEtcd:
      endpoints:
        - 192.168.3.10
        - 192.168.3.12
      service:
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    # VictoriaLogs single-node (LogsQL). Vector aggregator ships logs to it
    # via the Elasticsearch bulk API on port 9428.
    vlsingle:
      enabled: true
      spec:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
        retentionPeriod: 30d
        # Sized from observed 7d peak (~3.2GiB) — see vmsingle note.
        resources:
          requests:
            cpu: 200m
            memory: 4Gi
        storage:
          # Same 2-replica note as vmsingle above: on recreation use
          # storageClassName: longhorn-2r. Live volume is already 2-replica.
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # 50Gi filled to 99.98% (DiskRunsOutOfSpace firing, rows
              # intermittently dropped). Longhorn expands online. 30d
              # retention of vector-shipped logs needs ~3-4Gi/day.
              storage: 100Gi

    # Deploy our own kube-state-metrics and node-exporter (kube-prometheus-stack
    # was removed at cutover — these were previously borrowed from it).
    kube-state-metrics:
      enabled: true
    prometheus-node-exporter:
      enabled: true

    # NOTE: the VM-internal dashboards (victoriametrics-single-node/-vmagent/
    # -operator) ship a `ds` datasource variable pinned to uid
    # P1809F7CD0C75ACF3 (the chart's own Grafana uid), which does not exist
    # here — panels show "no data". Their ConfigMaps were patched in-cluster
    # to pin `ds` to uid "VictoriaMetrics". The sync job regenerates them on
    # every chart upgrade, so re-run that patch after each Renovate bump
    # (or until upstream fixes variable injection).

    defaultDashboards:
      dashboards:
        # These monitor components that no longer exist post-cutover:
        # prometheus/prometheus-remote-write watched the removed Prometheus;
        # alertmanager-overview's selectors never match our VMAlertmanager
        # on chart <=0.91.2 (fixed in 0.92.0 — re-enable it after the bump).
        prometheus:
          enabled: false
        prometheus-remote-write:
          enabled: false
        alertmanager-overview:
          enabled: false

    syncJob:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
