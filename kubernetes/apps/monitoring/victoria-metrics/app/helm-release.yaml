---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-metrics
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.91.2
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
      interval: 15m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 6
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 6
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app

    # Operator converts existing ServiceMonitor/PodMonitor/PrometheusRule CRs
    # into VM* equivalents (disable_prometheus_converter defaults to false),
    # so vmagent reuses the scrape config already defined across the cluster.
    victoria-metrics-operator:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      upgradeJob:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"

    # External Grafana is deployed separately; dashboard ConfigMaps created by
    # the sync-job are labeled grafana_dashboard=1 and picked up by its sidecar.
    grafana:
      enabled: false

    # Parallel-run: kube-prometheus-stack Alertmanager stays the live pager
    # until cutover. Both are configured with identical Pushover receivers,
    # so expect DUPLICATE notifications while both stacks evaluate rules.
    # At cutover: set the kube-prometheus-stack alertmanager default route
    # receiver to "null" (or remove the stack) to stop the duplicates.
    alertmanager:
      enabled: true
      spec:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
        # persist silences/nflog across restarts
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname", "job"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
          receiver: "pushover"
          routes:
            - receiver: "null"
              matchers:
                - alertname =~ "InfoInhibitor|Watchdog|RebootScheduled"
            - receiver: "null"
              matchers:
                - severity = "info"
            - receiver: "pushover"
              matchers:
                - severity = "critical"
              continue: true
            - receiver: "pushover"
              matchers:
                - alertname =~ "KubeNodeNotReady|KubeNodeUnreachable|KubeNodeReadinessFlapping"
              continue: true
        receivers:
          - name: "null"
          - name: "pushover"
            pushover_configs:
              - url_title: View in Alert Manager
                token: "${SECRET_PUSHOVER_PROD_TOKEN}"
                user_key: "${SECRET_PUSHOVER_USER_KEY}"
                send_resolved: true
                html: true
                sound: gamelan
                priority: |-
                  {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
                title: |-
                  [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
                message: |-
                  {{- range .Alerts }}
                    {{- if ne .Labels.severity "" }}
                      <b>Severity:</b> <i>{{ .Labels.severity }}</i>
                    {{- else }}
                      <b>Severity:</b> <i>N/A</i>
                    {{- end }}
                    {{- if ne .Annotations.description "" }}
                      <b>Description:</b> <i>{{ .Annotations.description }}</i>
                    {{- else if ne .Annotations.summary "" }}
                      <b>Summary:</b> <i>{{ .Annotations.summary }}</i>
                    {{- else if ne .Annotations.message "" }}
                      <b>Message:</b> <i>{{ .Annotations.message }}</i>
                    {{- else }}
                      <b>Description:</b> <i>N/A</i>
                    {{- end }}
                    {{- if gt (len .Labels.SortedPairs) 0 }}
                      <b>Details:</b>
                      {{- range .Labels.SortedPairs }}
                        • <b>{{ .Name }}:</b> <i>{{ .Value }}</i>
                      {{- end }}
                    {{- end }}
                  {{- end }}
    vmalert:
      enabled: true
      spec:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
        evaluationInterval: 60s
        resources:
          requests:
            cpu: 100m
            memory: 256Mi

    external:
      grafana:
        host: grafana.${SECRET_DEV_DOMAIN}
        datasource: VictoriaMetrics

    vmagent:
      enabled: true
      spec:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
          # Pin to the 64-core node: single replica, ~500m actual CPU — keeps
          # the small 8-core workers free for app workloads.
          kubernetes.io/hostname: worker-04
        scrapeInterval: 30s
        resources:
          requests:
            cpu: 400m
            memory: 512Mi

    vmsingle:
      enabled: true
      spec:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
          kubernetes.io/hostname: worker-04
        retentionPeriod: 90d
        resources:
          requests:
            cpu: 500m
            memory: 4Gi
        storage:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi

    # The chart's synced rule groups below duplicate the standard k8s rules
    # the operator already converts from kube-prometheus-stack's
    # PrometheusRules (kube-prometheus-stack-* VMRules). Evaluating both
    # doubles vmalert's query load on vmsingle (429 storm at boot) and
    # produces duplicate alert instances. Disabled here; RE-ENABLE at
    # kube-prometheus-stack removal. VM-component health rules (vm-health,
    # vmagent, vmalert, vmsingle, vlogs, vl-health, vmoperator), etcd, and
    # kubelet/kubernetes-system groups stay enabled — kube-prometheus-stack
    # has those disabled (etcd: false, kubernetesSystem: false, kubelet:
    # false) so they are NOT duplicated.
    # NOTE: alertmanager-rules on chart <=0.91.2 targets selectors that never
    # match our VMAlertmanager (fixed in 0.92.0) — stays disabled until the
    # chart bump, then it becomes the only AM watchdog after cutover.
    defaultRules:
      groups:
        alertmanager.rules:
          enabled: false
        general.rules:
          enabled: false
        k8s.rules.container_cpu_limits:
          enabled: false
        k8s.rules.container_cpu_requests:
          enabled: false
        k8s.rules.container_cpu_usage_seconds_total:
          enabled: false
        k8s.rules.container_memory_cache:
          enabled: false
        k8s.rules.container_memory_limits:
          enabled: false
        k8s.rules.container_memory_requests:
          enabled: false
        k8s.rules.container_memory_rss:
          enabled: false
        k8s.rules.container_memory_swap:
          enabled: false
        k8s.rules.container_memory_working_set_bytes:
          enabled: false
        k8s.rules.pod_owner:
          enabled: false
        kube-apiserver-burnrate.rules:
          enabled: false
        kube-apiserver-histogram.rules:
          enabled: false
        kube-apiserver-slos:
          enabled: false
        kube-prometheus-general.rules:
          enabled: false
        kube-prometheus-node-recording.rules:
          enabled: false
        kube-scheduler.rules:
          enabled: false
        kubernetes-apps:
          enabled: false
        kubernetes-resources:
          enabled: false
        kubernetes-storage:
          enabled: false
        kubernetes-system-controller-manager:
          enabled: false
        node-network:
          enabled: false
        node.rules:
          enabled: false
      # alertmanager source: on chart <=0.91.2 its rule selectors never match
      # our VMAlertmanager (fixed in 0.92.0) and duplicate the converted
      # kube-prometheus-stack alertmanager rules. Re-enable after chart bump.
      sources:
        alertmanager:
          enabled: false

    # VictoriaLogs single-node (LogsQL). Vector aggregator ships logs to it
    # via the Elasticsearch bulk API on port 9428.
    vlsingle:
      enabled: true
      spec:
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
          kubernetes.io/hostname: worker-04
        retentionPeriod: 30d
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
        storage:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

    # Reuse kube-state-metrics and node-exporter already deployed by
    # kube-prometheus-stack (their ServiceMonitors are converted by the
    # operator). Re-enable both here when kube-prometheus-stack is removed.
    kube-state-metrics:
      enabled: false
    prometheus-node-exporter:
      enabled: false

    # The k8s dashboards below are identical (same upstream source AND same
    # internal Grafana uid) to the ones shipped by kube-prometheus-stack.
    # Importing both makes the grafana sidecar write two CMs to the same
    # /tmp/dashboards/<name>.json file, flapping every resync (~90s) and
    # resetting variable selections — dashboards appear to have "no data".
    # Disabled here; kube-prometheus-stack's copies stay authoritative until
    # that stack is removed. RE-ENABLE (delete this block) at cutover.
    defaultDashboards:
      dashboards:
        apiserver:
          enabled: false
        cluster-total:
          enabled: false
        controller-manager:
          enabled: false
        etcd:
          enabled: false
        k8s-resources-cluster:
          enabled: false
        k8s-resources-multicluster:
          enabled: false
        k8s-resources-namespace:
          enabled: false
        k8s-resources-node:
          enabled: false
        k8s-resources-nodes-overview:
          enabled: false
        k8s-resources-pod:
          enabled: false
        k8s-resources-workload:
          enabled: false
        k8s-resources-workloads-namespace:
          enabled: false
        kubelet:
          enabled: false
        namespace-by-pod:
          enabled: false
        namespace-by-workload:
          enabled: false
        node-cluster-rsrc-use:
          enabled: false
        node-rsrc-use:
          enabled: false
        nodes:
          enabled: false
        nodes-aix:
          enabled: false
        nodes-darwin:
          enabled: false
        persistentvolumesusage:
          enabled: false
        pod-total:
          enabled: false
        prometheus:
          enabled: false
        scheduler:
          enabled: false
        workload-total:
          enabled: false
      # NOTE: the VM-internal dashboards (victoriametrics-single-node/-vmagent/
      # -operator) ship a `ds` datasource variable pinned to uid
      # P1809F7CD0C75ACF3 (the chart's own Grafana uid), which does not exist
      # here — panels show "no data". Their ConfigMaps were patched in-cluster
      # to pin `ds` to uid "VictoriaMetrics". The sync job regenerates them on
      # every chart upgrade, so re-run that patch after each Renovate bump
      # (or until upstream fixes variable injection).

    syncJob:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
