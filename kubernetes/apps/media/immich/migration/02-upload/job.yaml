---
# Temporary upload Job — NOT managed by Flux.
# Apply manually: kubectl apply -k kubernetes/apps/media/immich/migration/02-upload/
# Delete when done: kubectl delete -k kubernetes/apps/media/immich/migration/02-upload/
#
# Uploads Synology photos to Immich via REST API for users with accounts on
# both sides. Mounts NFS read-only and connects to both CNPG clusters.
# Runs in the databases namespace to reuse the postgres-superuser secret.
#
# Before applying:
#   1. Create the upload-api-keys secret (see kustomization.yaml)
#   2. kubectl apply -k kubernetes/apps/media/immich/migration/02-upload/
apiVersion: batch/v1
kind: Job
metadata:
  name: syno-immich-upload
  namespace: databases
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  activeDeadlineSeconds: 604800  # 7d — chuni has 125K+ photos
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      containers:
        - name: upload
          image: python:3.12-slim
          workingDir: /scripts
          command:
            - sh
            - -c
            - |
              pip install --no-cache-dir psycopg2-binary requests && \
              python /scripts/upload.py
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 8Gi
              cpu: 4
          env:
            - name: SYNO_DB_HOST
              value: synofotopg-rw.databases.svc.cluster.local
            - name: SYNO_DB_NAME
              value: app
            - name: IMMICH_DB_HOST
              value: vectorpg-rw.databases.svc.cluster.local
            - name: IMMICH_DB_NAME
              value: immich
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            - name: IMMICH_URL
              value: http://immich-server.media.svc.cluster.local:2283
            - name: UPLOAD_USERS
              value: "all"
            - name: CONCURRENCY
              value: "8"
            - name: CHECKPOINT_DIR
              value: "/checkpoint"
            - name: DRY_RUN
              value: "false"
            - name: CHUNI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: upload-api-keys
                  key: chuni
            - name: MIKE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: upload-api-keys
                  key: mike
            - name: SERENA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: upload-api-keys
                  key: serena
            - name: DARCY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: upload-api-keys
                  key: darcy
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: checkpoint
              mountPath: /checkpoint
            - name: syno-local
              mountPath: /import/syno-local
              readOnly: true
            - name: syno-ldap
              mountPath: /import/syno-ldap
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: upload-scripts
        - name: checkpoint
          persistentVolumeClaim:
            claimName: upload-checkpoint
        - name: syno-local
          nfs:
            server: 192.168.0.120
            path: /volume1/homes
            readOnly: true
        - name: syno-ldap
          nfs:
            server: 192.168.0.120
            path: /volume1/homes/@LH-KAO.FAMILY/61
            readOnly: true
