apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname nzbhydra2
  namespace: media
spec:
  releaseName: *appname
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 4
  upgrade:
    remediation:
      retries: 4
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568

      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
    controllers:
      main:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: 'true'
        # The linuxserver native binary (all 8.9.0 ls9x-ls102 builds) exits
        # silently before main() on this cluster's kernels; the jar release
        # runs fine. The app jar is fetched into the config PVC once and
        # skipped on subsequent boots.
        initContainers:
          fetch-app:
            image:
              repository: alpine
              tag: '3.22.4'
            command:
              - sh
              - -c
              - |
                test -f /config/app/lib/core-8.9.0-exec.jar && exit 0
                echo "fetching nzbhydra2 8.9.0 generic release"
                wget -q https://github.com/theotherp/nzbhydra2/releases/download/v8.9.0/nzbhydra2-8.9.0-generic.zip -O /tmp/g.zip
                unzip -oq /tmp/g.zip -d /config/app
        containers:
          main:
            image:
              repository: eclipse-temurin
              tag: 17.0.16_8-jre-alpine-3.22

            env:
              TZ: ${TIMEZONE}
            command:
              - java
              - -Xms64m
              - -Xmx384m
              - -Dsun.security.pkcs11.enable-solaris=false
              - -Dfile.encoding=UTF8
              - -jar
              - /config/app/lib/core-8.9.0-exec.jar
              - --nobrowser
              - --datafolder
              - /config
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 768Mi
    service:
      main:
        type: ClusterIP
        ports:
          http:
            port: 5076
        primary: true
    ingress:
      main:
        enabled: true
        annotations:
          hajimari.io/enable: 'true'
          hajimari.io/icon: cloud-search
          hajimari.io/appName: NZBHydra
          hajimari.io/group: Media
          cert-manager.io/cluster-issuer: letsencrypt-production
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: 
            networking-chain-authelia@kubernetescrd
        hosts:
          - host: &uri nzbhydra.${SECRET_DEV_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  port: http
        tls:
          - hosts:
              - *uri
            secretName: *uri
        className: traefik
    persistence:
      config:
        enabled: true
        existingClaim: nzbhydra2-config-volume
      omoikane:
        enabled: true
        type: nfs
        server: ${NAS_ADDR}
        path: /volume1/omoikane
        globalMounts:
          - path: /omoikane
      downloads:
        enabled: true
        type: nfs
        server: ${NAS_ADDR}
        path: /volume2/downloads
        globalMounts:
          - path: /downloads
      backup:
        enabled: true
        type: nfs
        server: ${NAS_ADDR}
        path: ${NFS_NZBHYDRA}
        globalMounts:
          - path: /config/backup
    podLabels:
      app: nzbhydra2
