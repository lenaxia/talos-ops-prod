---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gokore-config-files
  namespace: ragnarok
data:
  config.yaml: |
    network:
      packet_ver: 20200401
      region: "kRO"
      server_address: "rathena-renewal.ragnarok.svc.cluster.local:6900"
      connection_timeout: 30
      retry_count: 3
      retry_delay: 1000

    bot_manager:
      enabled: true
      bot_count: 50
      spawn_delay: 3000

    auth:
      username_template: "botijo{1}"
      password: "Melon.77"
      character:
        select_mode: "auto"
        index: 0

    log:
      level: "info"
      format: "text"

    ai:
      enabled: true
      behaviors:
        random_walk:
          enabled: true
          destination_max_distance: 50
          destination_min_distance: 20

    community:
      snapshot_path: "/config/community.json"

    cognitive:
      enabled: true
      llm_provider: "openai"
      reactive_mode: true
      strategic_mode: true
      strategy_interval: 90
      fleet_slots: 60
      fsm_end_conversation_coercion: 0.4
      fsm_max_chunks_soft_limit: 12

    llm:
      base_url: "${OPENAI_API_BASE}"
      models:
        strong: "glm-5.2"
        medium: "classifier"
        weak: "classifier"
      reactive_workers: 12
      strategic_workers: 6
      disable_thinking: true
      max_retries: 2
      retry_base_delay: 2s
      retry_max_delay: 15s
      breaker_threshold: 10
      breaker_reset_timeout: 60s
