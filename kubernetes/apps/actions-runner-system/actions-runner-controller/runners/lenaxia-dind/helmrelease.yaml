---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lenaxia-dind-runner
  namespace: actions-runner-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: actions-runner-system
  values:
    # Repo-scoped (lenaxia/LLMSafeSpaces) PRIVILEGED set for docker/kind
    # workloads (`runs-on: lenaxia-dind`): runner pod + docker:dind sidecar, jobs
    # set DOCKER_HOST implicitly via the shared /certs volume. ONLY
    # point workflow_dispatch/schedule-triggered (fork-safe) workflows
    # at this label — privileged pods on shared workers must not run
    # untrusted fork PRs (US-70 pool precedent: dispatch+cron only).
    githubConfigUrl: https://github.com/lenaxia/LLMSafeSpaces
    githubConfigSecret: actions-runner
    minRunners: 0
    maxRunners: 4
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        automountServiceAccountToken: true
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/worker
                      operator: In
                      values:
                        - "true"
                    # 2026-09-08: pin to the 64-core node — the only host
                    # that sustains the full US-70 pool suite (8-core
                    # workers starve the kind node's DB/controller under
                    # post-wave load). Memory made available by relocating
                    # prometheus + vmsingle + litellm to worker-00.
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - worker-04
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
            # Eviction protection: the runner agent is small but must not be
            # first-victim BestEffort when a busy dind sidecar pressures the node.
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
            command:
              - /bin/bash
              - -c
              - |
                timeout 90 bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/2376) 2>/dev/null; do sleep 2; done' || true
                exec /home/runner/run.sh
            env:
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_TLS_VERIFY
                value: "1"
              - name: DOCKER_CERT_PATH
                value: /certs/client/client
            volumeMounts:
              - name: dind-cert
                mountPath: /certs/client
          - name: dind
            # Digest-pinned to match gokore's reproducibility posture
            # (review round 1). docker:27-dind @ sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
            image: docker@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
            securityContext:
              privileged: true
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs/client
            volumeMounts:
              - name: dind-cert
                mountPath: /certs/client
            resources:
              # LLMSafeSpaces#1244: the US-70 pool's kind-in-dind was 3-5x
              # slower than hosted and starved cert-manager-webhook past its
              # progress deadline on a 1-CPU request (etcd CNI timeouts too).
              # 3 CPU / 8Gi (2026-09-08: restored). The 2026-09-07 trim
              # to 2300m was a placement workaround for the capacity
              # crisis (worker-04 memory-full after 477a6d0d, workers
              # fragmented) — which ended when worker-00 was re-imaged
              # onto Talos v1.13.6 and stabilized. At 2300m the US-70
              # pool's 40-way gVisor resume wave starved the sandbox
              # creation (FailedCreatePodSandBox, run 34195326798);
              # 3 CPU is the measured-full sizing. No cpu limit: burst
              # posture unchanged. Memory: kind node + 5-image build
              # churn; no limit (a limit OOMKills dind mid-build).
              requests:
                cpu: 3
                # 2Gi request fits worker-04's requests math after the
                # litellm replica was cordon-evicted to worker-00 (owner
                # operation, 2026-09-08; no git pin — it can drift back on
                # a future reschedule). Scheduling-only: no limit; the
                # node's ACTUAL headroom is ~19Gi (kubectl top: 69% used;
                # the 96% requests figure is vllm-fleet inflation) — kind
                # + build churn burst into real RAM.
                memory: 2Gi
        volumes:
          - name: dind-cert
            emptyDir: {}
