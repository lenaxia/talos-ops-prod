---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname tailscale-subnet
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
      securityContext:
        # Kernel-mode subnet routing: TUN device + net admin required.
        capabilities:
          add: ['NET_ADMIN', 'NET_RAW']
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          main:
            image:
              repository: docker.io/tailscale/tailscale
              tag: 1.102.4
            env:
              TS_HOSTNAME: talos-subnet
              # From cluster-secrets via Flux substitution — join is unattended.
              TS_AUTHKEY: ${SECRET_TAILSCALE_PREAUTH_KEY}
              TS_AUTH_ONCE: 'true'
              TS_USERSPACE: 'false'
              TS_STATE_DIR: /var/lib/tailscale
              TS_EXTRA_ARGS: >-
                --advertise-routes=192.168.0.0/20
                --advertise-exit-node
                --accept-dns=false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      # Node identity lives here — without it every pod restart is a fresh
      # Tailscale node needing re-auth and route re-approval.
      state:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 512Mi
        storageClass: longhorn
        retain: true
        globalMounts:
          - path: /var/lib/tailscale
      tun:
        enabled: true
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
