---
# Shadow S3 endpoint for SeaweedFS during migration. MinIO keeps serving
# s3.<domain> until cutover; flip this host's backend at cutover time.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-s3-shadow
  namespace: networking
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: networking-chain-noauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: &host "s3-shadow.${SECRET_DEV_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-s3-shadow
                port:
                  number: 8333
  tls:
    - hosts:
        - *host
      secretName: *host
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3-shadow
  namespace: networking
spec:
  type: ExternalName
  externalName: seaweedfs-s3.storage.svc.cluster.local
  ports:
    - port: 8333
      targetPort: 8333
      protocol: TCP
      name: http
