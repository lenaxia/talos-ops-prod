---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname webfinger-kao
  namespace: networking
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      interval: 16m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
    controllers:
      main:
        strategy: Recreate
        annotations:
          # JRD is subPath-mounted from the ConfigMap — subPath volumes do not
          # hot-sync, so Reloader must restart the pod on content changes.
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: httpd
              tag: 2.4.68
            env:
              TZ: ${TIMEZONE}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
    service:
      main:
        ports:
          http:
            port: 80
        primary: true
    ingress:
      main:
        enabled: true
        annotations:
          hajimari.io/enable: 'false'
          cert-manager.io/cluster-issuer: letsencrypt-production
          # WebFinger must be publicly readable — no authelia chain here.
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: networking-chain-no-auth@kubernetescrd
        hosts:
          - host: &uri ${SECRET_PROD_DOMAIN_KF}
            paths:
              - path: /
                pathType: Prefix
                service:
                  port: http
        tls:
          - hosts:
              - *uri
            secretName: kao-family-webfinger-tls
    persistence:
      configmap:
        enabled: true
        type: configMap
        name: webfinger-kao
        globalMounts:
          # Serve the JRD at the exact RFC 7033 path /.well-known/webfinger
          # (mounted as a FILE — avoids Apache's directory 301) plus a
          # human-friendly /.well-known/webfinger.json variant.
          - path: /usr/local/apache2/htdocs/.well-known/webfinger
            subPath: webfinger.json
          - path: /usr/local/apache2/htdocs/.well-known/webfinger.json
            subPath: webfinger.json
