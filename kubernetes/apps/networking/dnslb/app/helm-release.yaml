---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname dnslb
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
    controllers:
      main:
        # Single replica: the longhorn PVC holds the Tailscale node identity
        # and cannot be shared. dns01 remains the fallback during migration.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          main:
            image:
              repository: ghcr.io/0xerr0r/blocky
              tag: v0.24
            env:
              TZ: ${TIMEZONE}
            securityContext:
              capabilities:
                add: ['NET_BIND_SERVICE']
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          tailscale:
            image:
              repository: docker.io/tailscale/tailscale
              tag: 1.102.4
            env:
              TS_HOSTNAME: dnslb-k8s
              TS_AUTHKEY: ${SECRET_TAILSCALE_PREAUTH_KEY}
              TS_AUTH_ONCE: 'true'
              TS_USERSPACE: 'false'
              TS_STATE_DIR: /var/lib/tailscale
              TS_EXTRA_ARGS: >-
                --advertise-routes=192.168.0.0/20
                --advertise-exit-node
                --accept-dns=false
            securityContext:
              capabilities:
                add: ['NET_ADMIN', 'NET_RAW']
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: 192.168.5.53
        annotations:
          cilium.io/l2-ip-pool: reserved
        ports:
          dns-tcp:
            enabled: true
            port: 53
            protocol: TCP
          dns-udp:
            enabled: true
            port: 53
            protocol: UDP
          http:
            enabled: true
            port: 4000
            protocol: TCP
    persistence:
      config:
        enabled: true
        type: configMap
        name: blocky-config
        advancedMounts:
          main:
            main:
              - path: /app/config.yml
                subPath: config.yml
      state:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 512Mi
        storageClass: longhorn
        retain: true
        advancedMounts:
          main:
            tailscale:
              - path: /var/lib/tailscale
      tun:
        enabled: true
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        advancedMounts:
          main:
            tailscale:
              - path: /dev/net/tun
