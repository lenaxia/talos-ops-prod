---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname dnslb
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
    controllers:
      main:
        # Single replica: the longhorn PVC holds the Tailscale node identity
        # and cannot be shared. dns01 remains the fallback during migration.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          main:
            image:
              repository: ghcr.io/0xerr0r/blocky
              tag: v0.24
            env:
              TZ: ${TIMEZONE}
            securityContext:
              capabilities:
                add: ['NET_BIND_SERVICE']
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          tailscale:
            image:
              repository: docker.io/tailscale/tailscale
              tag: v1.102.5
            env:
              TS_AUTHKEY: ${SECRET_TAILSCALE_PREAUTH_KEY}
            # Bypass containerboot (insists on kube RBAC). $$ escapes Flux
            # envsubst so the shell expands it at runtime, not Flux.
            command:
              - /bin/sh
              - -c
              - |
                mknod /dev/net/tun c 10 200 2>/dev/null || true
                sysctl -w net.ipv4.ip_forward=1 2>/dev/null || true
                # Talos is nft-only; default iptables (legacy) can't see the
                # kernel tables. Repoint to the nft backend first.
                mkdir -p /usr/local/sbin
                for b in iptables iptables-save iptables-restore ip6tables ip6tables-save ip6tables-restore; do
                  [ -x /usr/sbin/$${b}-nft ] && ln -sf /usr/sbin/$${b}-nft /usr/local/sbin/$$b
                done
                export PATH=/usr/local/sbin:$$PATH
                tailscaled --tun=tailscale0 --state=/var/lib/tailscale/tailscaled.state &
                until tailscale up --authkey="$${TS_AUTHKEY}" --hostname=dnslb-k8s --advertise-routes=192.168.0.0/20 --advertise-exit-node --accept-dns=false; do
                  sleep 5
                done
                wait
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: 192.168.5.53
        labels:
          cilium.io/l2-ip-pool: reserved
        ports:
          dns-tcp:
            enabled: true
            port: 53
            protocol: TCP
          dns-udp:
            enabled: true
            port: 53
            protocol: UDP
          http:
            enabled: true
            port: 4000
            protocol: TCP
    persistence:
      config:
        enabled: true
        type: configMap
        name: blocky-config
        advancedMounts:
          main:
            main:
              - path: /app/config.yml
                subPath: config.yml
      state:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 512Mi
        storageClass: longhorn
        retain: true
        advancedMounts:
          main:
            tailscale:
              - path: /var/lib/tailscale
