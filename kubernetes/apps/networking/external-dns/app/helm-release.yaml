---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    nameOverride: *app
    provider: cloudflare

    extraArgs:
      - --cloudflare-proxied
      - --annotation-filter=external-dns.home.arpa/enabled in (true)

    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns
            key: CF_API_TOKEN

    policy: sync

    sources:
      - ingress

    domainFilters:
      - "${SECRET_DEV_DOMAIN}"

    txtPrefix: "k8s."
    txtOwnerId: "homelab"

    logLevel: info

    deploymentAnnotations:
      reloader.stakater.com/auto: "true"

    serviceMonitor:
      enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        # raised from 50m 2026-08-21: 40%+ CPU throttling (alert CPUThrottlingHigh)
        cpu: 500m
        memory: 256Mi

    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
