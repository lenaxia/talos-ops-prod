---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: databases
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
    # sentinel port (26379) removed as of 2026-07-06 when we scaled to single-replica.
    # See helm-release.yaml and the closed PR #1962 for context.
---
apiVersion: v1
kind: Service
metadata:
  name: redis-primary
  namespace: databases
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
  annotations:
    redis.home.arpa/change-notice: >-
      Changed from ExternalName (CNAME to redis-0.redis-headless) to a
      ClusterIP selector Service on 2026-09-01. Same DNS name, so no client
      changes needed (consumers: authelia, and any app following the
      redis-primary convention). Motivation: authelia intermittently hit
      'dial tcp: lookup redis-primary...: i/o timeout' on the CNAME chain
      (2+ resolver round-trips per dial); a single A record halves the
      DNS exposure per connection attempt.
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
