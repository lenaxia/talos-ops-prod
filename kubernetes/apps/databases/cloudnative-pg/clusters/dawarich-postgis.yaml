---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: dawarich-postgis-scheduled-backup
  namespace: databases
spec:
  schedule: "0 0 14 * * *"
  backupOwnerReference: self
  cluster:
    name: dawarich-postgis
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dawarich-postgis
  namespace: databases
spec:
  instances: 2  # TODO: bump to 3 after Longhorn disk pressure is resolved
  imageName: ghcr.io/cloudnative-pg/postgis:16
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: longhorn
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-superuser
  affinity:
    nodeSelector:
      node-role.kubernetes.io/worker: "true"
    podAntiAffinityType: preferred
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: "s3://${S3_CNPG}/dawarich-postgis16"
      endpointURL: http://minio.storage.svc.cluster.local:9000
      serverName: dawarich-postgis-backup-v01
      s3Credentials:
        accessKeyId:
          name: postgres-minio
          key: MINIO_ACCESS_KEY
        secretAccessKey:
          name: postgres-minio
          key: MINIO_SECRET_KEY
        region:
          name: postgres-minio
          key: MINIO_REGION
  bootstrap:
    initdb: {}
