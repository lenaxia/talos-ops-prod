# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname whisper
  namespace: &namespace home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "special"
          effect: "NoSchedule"

    controllers:
      app:
        type: deployment
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: rhasspy/wyoming-whisper
              tag: '3.6.0'
            args:
              - --model=base.en
              - --language=en
              - --beam-size=5
              - --compute-type=int8
            probes:
              readiness:
                enabled: false
              liveness:
                enabled: false
            resources:
              requests:
                cpu: "1"
                memory: "3Gi"
              limits:
                cpu: "1"
                memory: "3Gi"

      # keepalive canary: TCP check every 10m catches zombie listeners so a
      # restart happens before a satellite needs the service
      keepalive:
        type: cronjob
        cronjob:
          schedule: "*/10 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistoryLimit: 1
          failedJobsHistoryLimit: 3
        containers:
          app:
            image:
              repository: busybox
              tag: '1.37'
            command:
              - nc
              - -z
              - -w
              - '5'
              - whisper.home.svc.cluster.local
              - '10300'
            resources:
              requests:
                cpu: "10m"
                memory: "16Mi"
              limits:
                memory: "32Mi"

    podDisruptionBudget:
      app:
        enabled: true
        minAvailable: 1

    service:
      app:
        controller: app
        primary: true
        type: ClusterIP
        ports:
          wyoming:
            port: 10300
