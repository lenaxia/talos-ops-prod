# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname whisper
  namespace: &namespace home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "special"
          effect: "NoSchedule"

    controllers:
      app:
        type: deployment
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: rhasspy/wyoming-whisper
              tag: '3.6.0'
            args:
              - --name=whisper
              - --model=small-en
              - --language=en
              - --beam-size=5
              - --compute-type=int8
            probes:
              readiness:
                enabled: false
              liveness:
                enabled: false
            resources:
              requests:
                cpu: "1"
                memory: "2Gi"
              limits:
                memory: "4Gi"

    service:
      app:
        controller: app
        primary: true
        type: ClusterIP
        ports:
          wyoming:
            port: 10300
