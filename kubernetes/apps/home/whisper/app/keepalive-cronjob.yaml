---
# TCP canary: detects a dead/zombie wyoming listener every 10m so it can be
# restarted before a voice satellite needs it. Model stays in RAM regardless.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: whisper-keepalive
  namespace: home
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 30
      template:
        spec:
          restartPolicy: Never
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "special"
              effect: "NoSchedule"
          containers:
            - name: check
              image: busybox:1.37
              command:
                - nc
                - -z
                - -w
                - "5"
                - whisper.home.svc.cluster.local
                - "10300"
              resources:
                requests:
                  cpu: "10m"
                  memory: "16Mi"
                limits:
                  memory: "32Mi"
