---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-home-opengist
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/enabled: "true"
spec:
  dependsOn:
    - name: cluster-storage-longhorn
  path: ./kubernetes/apps/home/opengist/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2beta1
      kind: HelmRelease
      name: opengist
      namespace: home
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# opengist-mcp — MCP server sidecar (separate Kustomization so it can be
# debugged/reverted independently of the opengist pod).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-home-opengist-mcp
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/enabled: "true"
spec:
  dependsOn:
    # The MCP server calls the Opengist REST API; the opengist app must be
    # reconciled and healthy first.
    - name: cluster-home-opengist
  path: ./kubernetes/apps/home/opengist/mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: opengist-mcp
      namespace: home
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
