---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# ----------------------------------------------------------------------------
# Stage 1 — DB role + database + pgvector extension on the ragpg cluster.
# Health-check on the Job: Flux marks this Kustomization Ready only when
# the Job completes (succeeded=True), which Stage 2's dependsOn waits on.
# ----------------------------------------------------------------------------
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-home-librechat-ragapi-dbinit
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/enabled: "true"
spec:
  dependsOn:
    # ragpg Cluster lives in this Kustomization's tree
    - name: cluster-databases-postgres-clusters
      namespace: flux-system
  path: ./kubernetes/apps/home/librechat-ragapi/db-init
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: librechat-ragapi-postgres-init
      namespace: home
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# ----------------------------------------------------------------------------
# Stage 2 — the RAG API service. Waits for db-init + litellm (embeddings
# backend) so the first pod start can reach both the vector store and
# bge-m3 via the LiteLLM router.
# ----------------------------------------------------------------------------
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-home-librechat-ragapi
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/enabled: "true"
spec:
  dependsOn:
    - name: cluster-home-librechat-ragapi-dbinit
      namespace: flux-system
    - name: cluster-home-litellm
      namespace: flux-system
  path: ./kubernetes/apps/home/librechat-ragapi/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2beta1
      kind: HelmRelease
      name: ragapi
      namespace: home
  interval: 30m
  retryInterval: 1m
  timeout: 5m
