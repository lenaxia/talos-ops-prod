# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ragapi
  namespace: home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"

    controllers:
      main:
        type: deployment
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            # "lite" build: remote embeddings only (we embed via LiteLLM,
            # not sentence-transformers), so no local model weight needed.
            image:
              repository: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite
              tag: v0.9.0
            env:
              TZ: ${TIMEZONE}
              # ── Vector store (ragpg CNPG cluster, provisioned by db-init) ──
              DB_HOST: ragpg-rw.databases.svc.cluster.local
              DB_PORT: "5432"
              POSTGRES_DB: ragapi
              POSTGRES_USER: ragapi
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: ragapi-credentials
                    key: postgres-password
              # ── Embeddings: bge-m3 via the in-cluster LiteLLM router ────
              EMBEDDINGS_PROVIDER: openai
              EMBEDDINGS_MODEL: bge-m3
              RAG_OPENAI_BASEURL: http://litellm.home.svc.cluster.local:4000/v1
              RAG_OPENAI_API_KEY:
                valueFrom:
                  # Same LiteLLM virtual key LibreChat uses (verified to
                  # have bge-m3 embeddings access).
                  secretKeyRef:
                    name: librechat
                    key: THEKAO_AI_API_KEY
              # bge-m3 is not a known OpenAI model — skip client-side
              # tiktoken context-length checking for it.
              RAG_CHECK_EMBEDDING_CTX_LENGTH: "false"
              COLLECTION_NAME: librechat
              RAG_UPLOAD_DIR: /data/uploads
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      main:
        primary: true
        ports:
          http:
            port: 8000

    persistence:
      uploads:
        type: emptyDir
        globalMounts:
          - path: /data/uploads
