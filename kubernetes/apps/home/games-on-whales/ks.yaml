---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-home-games-on-whales
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/enabled: "true"
spec:
  dependsOn:
    # cert-manager issues the Traefik TLS cert for wolf.${SECRET_DEV_DOMAIN}.
    # (The ingress is shipped commented out until the streaming path is
    # proven stable — see app/helm-release.yaml.)
    - name: cert-manager-issuers
    # Both the Wolf config PVC (5Gi) and the dind runtime PVC (200Gi) are
    # Longhorn volumes.
    - name: cluster-storage-longhorn
  path: ./kubernetes/apps/home/games-on-whales/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: games-on-whales
      namespace: home
  interval: 30m
  retryInterval: 1m
  timeout: 10m
