---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-home-games-on-whales
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/enabled: "true"
spec:
  dependsOn:
    # CRDs must be established before the chart (install.crds: Skip).
    - name: cluster-home-games-on-whales-crds
    # The chart mints the proxy TLS cert via cert-manager.
    - name: cert-manager-issuers
    # Steam library PVC (App volumeClaimTemplate) is Longhorn.
    - name: cluster-storage-longhorn
  path: ./kubernetes/apps/home/games-on-whales/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: games-on-whales
      namespace: home
  interval: 30m
  retryInterval: 1m
  timeout: 10m
