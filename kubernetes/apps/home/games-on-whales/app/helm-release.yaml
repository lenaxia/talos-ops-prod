---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/library/common/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app games-on-whales
  namespace: &namespace home
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: direwolf-operator
    # same namespace as this HelmRelease (see ../app/repository.yaml)
  driftDetection:
    mode: enabled
  maxHistory: 3
  install:
    # CRDs vendored under ../crds (fork 29eb075 versions, newer than chart's)
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    imagePullSecrets:
      - name: ghcr-lenaxia
    # ──────────────────────────────────────────────────────────────────────
    # games-on-whales — via the Fenrir/direwolf operator
    # ──────────────────────────────────────────────────────────────────────
    # Architecture (replaces the 2026-10-01 wolf+podman-sidecar attempt,
    # which could not get GL/EGL working for app containers spawned through
    # a nested runtime): the direwolf operator manages everything as native
    # k8s resources —
    #
    #   direwolf-operator  reconcile App/User CRs into session pods:
    #                      each session = one pod (wolf + wolf-agent
    #                      sidecars + the app container from the App CR),
    #                      GPU via runtimeClassName: nvidia (no nested
    #                      runtime, no CDI-in-pod, no lib mounts).
    #   moonlight-proxy    fronts HTTP/HTTPS for pairing + app launch;
    #                      video/audio/control flow peer-to-peer to the
    #                      session service, which shares the LB VIP with
    #                      the proxy via the Cilium LBIPAM sharing key.
    #
    # Images are the cogito-ops "known-good" set (their Amnesia cluster:
    # Talos 1.13 + NVIDIA 595 open modules + Steam video/audio/gameplay
    # proven 2026-09-30, plans/fenrir-upstream-findings.md):
    #   operator/proxy: timblakely's builds of shrinedogg/fenrir@29eb075
    #     (multi-user fork + dial-timeout/app-selection/AddApp/runner
    #     fixes on top)
    #   wolf/wolf-agent: shrinedogg's wolf fork images (carry wolf#466-era
    #     fixes; the #465 start_audio_server bug is patched at runtime by
    #     the wolf-root-entrypoint ConfigMap in ../sessions).
    # ──────────────────────────────────────────────────────────────────────
    controllers:
      direwolf_operator:
        containers:
          operator:
            image:
              repository: ghcr.io/timblakely/fenrir-operator
              # tag: 29eb075…agentdial3s-appregister-runner — Renovate:
              # digest pin, keep tag in comment
              tag: 29eb075afe1ab61490196a7272fd21b5b6313cfc-agentdial3s-appregister-runner-36438304890@sha256:7a73d32318a048bb6e4475b0b95540ea58b4dc236a4a03285288c3ee489ad199
              pullPolicy: IfNotPresent
            args:
              # Cilium LBIPAM: session Services share the proxy's VIP,
              # distinguished by port tuple.
              - --lb-sharing-key=games-on-whales
              - --proxy-service-name=direwolf
            env:
              AGENT_IMAGE: docker.io/shrinedogg/wolf-agent@sha256:f51e52cee40645dd6a4cb8d216dcf94f9c35257e2a884be35eaceccc2bb966bc
              WOLF_IMAGE: ghcr.io/lenaxia/games-on-whales-wolf@sha256:9df50178aacbb21e4cf837f72ff1f1c5602db803ecba558476f85f99c8e4041b
      moonlight_proxy:
        containers:
          proxy:
            image:
              repository: ghcr.io/lenaxia/fenrir-moonlight-proxy
              # tag: 29eb075…-36366361406 — Renovate: digest pin
              tag: resume-fix@sha256:913f0c869d5fe6beae074b98a561c3798cba40e5b4cb78ebf3ba2907f2599ce7
              pullPolicy: IfNotPresent
    service:
      app:
        controller: moonlight_proxy
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        labels:
          # LBIPAM pool membership is label-selected in this cluster
          # (192.168.5.0/25 reserved block).
          cilium.io/l2-ip-pool: reserved
        annotations:
          # Reuse the VIP previously held by the wolf+podman deployment.
          lbipam.cilium.io/ips: "${SVC_GOW_ADDR}"
          lbipam.cilium.io/sharing-key: games-on-whales
        # The proxy listens plain HTTP on 47989 and HTTPS on 47984. The
        # chart's default port names are REVERSED (upstream bug; cogito-ops
        # PR#176) — the User controller builds the public PIN URL from the
        # port named http, so the names must match reality.
        ports:
          http:
            protocol: TCP
            port: 47989
          https:
            protocol: TCP
            port: 47984
