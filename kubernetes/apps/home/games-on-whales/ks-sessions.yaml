---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-home-games-on-whales-sessions
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-home-games-on-whales
  path: ./kubernetes/apps/home/games-on-whales/sessions
  # prune:false — the User owns the Steam library PVCs via controller
  # references; losing the CRs (or pruning them) garbage-collects the
  # library. Deletions must be deliberate and manual.
  prune: false
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  interval: 30m
  retryInterval: 1m
  timeout: 10m
