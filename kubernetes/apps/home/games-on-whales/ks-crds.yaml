---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-home-games-on-whales-crds
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/home/games-on-whales/crds
  # Never prune CRDs — User-owned PVCs (Steam library) are garbage-collected
  # if the CRD/CR ownership chain breaks.
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
