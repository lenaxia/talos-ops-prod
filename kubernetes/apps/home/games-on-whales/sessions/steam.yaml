apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: steam
spec:
  title: Steam
  id: 2
  isHDRSupported: false
  appAssetWebP: 
  volumeClaimTemplate:
    spec:
      storageClassName: longhorn
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 200Gi
  template:
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: worker-04
      tolerations:
      - key: dedicated
        operator: Equal
        value: special
        effect: NoSchedule
      hostIPC: true
      containers:
      - name: app
        image: ghcr.io/games-on-whales/steam@sha256:4f88a5e363c783791fbbe432661d70d6775629fa8c74038b21622477cf20e0ab
        resources:
          requests:
            nvidia.com/gpu: '1'
            memory: 2Gi
          limits:
            nvidia.com/gpu: '1'
            memory: 24Gi
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
        env:
        - name: GBM_BACKENDS_PATH
          value: /data/nv71/lib/gbm:/usr/local/lib/gbm:/usr/lib/x86_64-linux-gnu/gbm
        - name: VK_DRIVER_FILES
          value: /etc/vulkan/icd.d/nvidia_icd.json
        - name: RUN_GAMESCOPE
          value: 'true'
        - name: STEAM_STARTUP_FLAGS
          value: -bigpicture
        - name: WLR_DRM_NO_MODIFIERS
          value: '1'
        - name: GAMESCOPE_DISABLE_MODIFIERS
          value: '1'
        command:
        - /bin/bash
        - -ec
        - "echo '=== lib diagnostics ==='\n              echo \"LDLP=$LD_LIBRARY_PATH\
          \ GBM=$GBM_BACKENDS_PATH\"\n              ls -la /usr/local/nvidia/lib64/\
          \ 2>&1 | grep -E \"allocator|EGL_nvidia\" | head -4\n              echo\
          \ \"lib64-count: $(ls /usr/local/nvidia/lib64 2>/dev/null | wc -l)\"\nmkdir\
          \ -p /usr/local/nvidia/lib64 && cp -a /home/retro/.nv71libs/. /usr/local/nvidia/lib64/\
          \ && echo LIBCOPY-OK || echo LIBCOPY-FAILED; ls /home/retro/.nv71libs >/dev/null\
          \ 2>&1 && echo SRC-VISIBLE || echo SRC-MISSING\n              until [ -S\
          \ \"$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY\" ] && [ -S \"$XDG_RUNTIME_DIR/pulse-socket\"\
          \ ]; do\n  echo 'Waiting for Wayland and Pulse sockets'\n  sleep 1\ndone\n\
          # The operator mounts a fresh per-app subdirectory of the PVC.\nchown -R\
          \ \"${PUID:-1000}:${PGID:-1000}\" /home/retro\nexec /entrypoint.sh\n"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: udev-data
          mountPath: /run/udev
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      initContainers: []
  wolfConfig:
    runtimeVariables:
      renderNode: /dev/dri/card2
