apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: testball
spec:
  title: Test Ball
  id: 1
  isHDRSupported: false
  appAssetWebP: 
  template:
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: worker-04
      tolerations:
      - key: dedicated
        operator: Equal
        value: special
        effect: NoSchedule
      containers: []
  wolfConfig:
    runtimeVariables:
      renderNode: /dev/dri/renderD130
    startAudioServer: false
    startVirtualCompositor: true
    audio:
      source: audiotestsrc wave=ticks is-live=true
    # 2026-10-03: no video.source override. A synthetic source (videotestsrc)
    # prevented waylanddisplaysrc from starting -> no wayland socket -> the
    # runner wait timed out at 5s -> wolf aborted the session (the "4-second
    # kill"). Real producer = socket = stable session.
    video:
      sink: ''
