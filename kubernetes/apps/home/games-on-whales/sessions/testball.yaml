apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: testball
spec:
  title: Test Ball
  id: 1
  isHDRSupported: false
  appAssetWebP: 
  template:
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: worker-04
      tolerations:
      - key: dedicated
        operator: Equal
        value: special
        effect: NoSchedule
      containers: []
  wolfConfig:
    runtimeVariables:
      renderNode: /dev/dri/renderD130
    startAudioServer: false
    startVirtualCompositor: true
    audio:
      source: audiotestsrc wave=ticks is-live=true
    # 2026-10-03: video.source override REMOVED. With a synthetic source
    # (videotestsrc) wolf never starts waylanddisplaysrc -> no wayland socket
    # -> the runner wait times out at 5s -> wolf aborts the session (the
    # "4-second kill"). Real producer = socket = stable session.
    video: {}
