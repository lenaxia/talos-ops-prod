apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: User
metadata:
  name: mike
spec:
  resources:
    limits:
      memory: 24Gi
    requests:
      memory: 4Gi
  volumes:
  - name: wolf-root-entrypoint
    configMap:
      name: wolf-root-entrypoint
      defaultMode: 493
  - name: udev-data
    emptyDir: {}
  sidecarPolicies:
    wolf:
      env:
      - name: NVIDIA_DRIVER_CAPABILITIES
        value: all
      - name: NVIDIA_VISIBLE_DEVICES
        # Multi-GPU CUDA ordinal fix (proven 2026-10-03): wolf maps renderD130
        # (0000:46:00.0) to CUDA ordinal 1 = its index among the FOUR GPUs in
        # /proc/driver/nvidia/gpus (global procfs, ignores container masking).
        # With a single pinned GPU, CUDA only exposes ordinal 0 -> context
        # creation fails -> capture path emits BLACK frames (YAVG=16 flat on
        # every frame, all apps incl. testball). Expose 01:00.0 as ordinal 0
        # (PCI-sorts before 46:00.0 in every CUDA ordering) so ordinal 1 =
        # 46:00.0 = what wolf requests.
        # UUIDs: 01:00.0=GPU-6726851a-d64e-09c8-a938-1537593e3106 (minor 3)
        #        46:00.0=GPU-755d8528-...f4547 (minor 2, ours)
        value: GPU-6726851a-d64e-09c8-a938-1537593e3106,GPU-755d8528-c8c7-5fd4-f441-f061368f4547
      - name: CUDA_DEVICE_ORDER
        # CUDA enumerates fastest-first (4090=device0) unlike nvidia-smi/procfs
        # PCI order. wolf derives its ordinal from PCI-sorted procfs; without
        # this the context lands on the wrong GPU -> waylanddisplaysrc panics
        # "Failed to create CUDA image from EGLImage: CUDA_ERROR_INVALID_DEVICE"
        # (proved in gow-wolftest, 2026-10-03). PCI order + two-GPU pin makes
        # CUDA device 1 == 46:00.0 deterministically.
        value: PCI_BUS_ID
      - name: GBM_BACKENDS_PATH
        value: /usr/local/lib/gbm:/usr/lib/x86_64-linux-gnu/gbm
      volumeMounts:
      - name: wolf-root-entrypoint
        mountPath: /entrypoint.sh
        subPath: entrypoint.sh
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
          squat.ai/uinput: '1'
        limits:
          memory: 4Gi
          squat.ai/uinput: '1'
    wolfAgent:
      volumeMounts:
      - name: udev-data
        mountPath: /run/udev
      securityContext:
        capabilities:
          add:
          - NET_ADMIN
