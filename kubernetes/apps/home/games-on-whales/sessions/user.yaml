apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: User
metadata:
  name: mike
spec:
  resources:
    limits:
      memory: 24Gi
    requests:
      memory: 4Gi
  volumes:
  - name: wolf-root-entrypoint
    configMap:
      name: wolf-root-entrypoint
      defaultMode: 493
  - name: udev-data
    emptyDir: {}
  sidecarPolicies:
    wolf:
      env:
      - name: NVIDIA_DRIVER_CAPABILITIES
        value: all
      - name: NVIDIA_VISIBLE_DEVICES
        value: GPU-755d8528-c8c7-5fd4-f441-f061368f4547
      - name: GBM_BACKENDS_PATH
        value: /usr/local/lib/gbm:/usr/lib/x86_64-linux-gnu/gbm
      volumeMounts:
      - name: wolf-root-entrypoint
        mountPath: /entrypoint.sh
        subPath: entrypoint.sh
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          memory: 4Gi
    wolfAgent:
      volumeMounts:
      - name: udev-data
        mountPath: /run/udev
      securityContext:
        capabilities:
          add:
          - NET_ADMIN
