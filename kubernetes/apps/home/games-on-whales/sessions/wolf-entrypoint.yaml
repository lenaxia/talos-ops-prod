apiVersion: v1
data:
  entrypoint.sh: "#!/usr/bin/env bash\nset -e\nsource /opt/gow/bash-lib/utils.sh\n\
    # RTP egress diagnostics: capture all UDP to the LAN client.\n    (apt-get update\
    \ && apt-get install -y tcpdump) >/dev/null 2>&1 || true\n    setsid nohup tcpdump\
    \ -ni any \"udp and host 192.168.0.5\" -U -w /tmp/rtp.pcap </dev/null >/dev/null\
    \ 2>&1 &\nexport UNAME=root PUID=0 PGID=0 HOME=/root\n    # upstream-evidence\
    \ capture: driver-side EGL diagnostics\n    export EGL_LOG_LEVEL=debug\nfor init_script\
    \ in /etc/cont-init.d/*.sh; do\n  gow_log \"[ $${init_script}: executing... ]\"\
    \n  source \"$${init_script}\"\ndone\n# The pinned Wolf fork predates games-on-whales/wolf#466:\
    \ apps registered\n# through /api/v1/apps/add persist start_audio_server=false.\
    \ The Steam\n# entry is retained on the PVC, so correct it before Wolf reads the\
    \ config.\nconfig=/mnt/data/wolf/cfg/config.toml\nif [[ -f \"$${config}\" ]];\
    \ then\n  python3 - \"$${config}\" <<'PY'\nfrom pathlib import Path\nimport sys\n\
    \npath = Path(sys.argv[1])\nconfig = path.read_text()\nold = \"    start_audio_server\
    \ = false\\n    start_virtual_compositor = true\\n    title = 'Steam'\"\nif config.count(old)\
    \ == 1:\n    path.write_text(config.replace(old, old.replace('false', 'true',\
    \ 1), 1))\nPY\nfi\nchmod +x /opt/gow/startup.sh\nexec /opt/gow/startup.sh\n"
kind: ConfigMap
metadata:
  name: wolf-root-entrypoint
