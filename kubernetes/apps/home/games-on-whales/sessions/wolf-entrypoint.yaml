apiVersion: v1
data:
  entrypoint.sh: "#!/usr/bin/env bash\nset -e\nsource /opt/gow/bash-lib/utils.sh\n\
    \    # Hybrid stack (driver .91 EGL + .71 GBM allocator): .71 EGL cannot\n   \
    \ # enumerate against the .91 kernel (eglQueryDevicesEXT BAD_ALLOC) and\n    #\
    \ .91's allocator is broken in containers \u2014 so ship ONLY the allocator\n\
    \    # from the .71 overlay; everything else stays on the injected .91.\n    mkdir\
    \ -p /nvalloc && cp /opt/nv71/libnvidia-allocator.so* /nvalloc/\n    export LD_LIBRARY_PATH=/nvalloc:$$LD_LIBRARY_PATH\n\
    \nexport UNAME=root PUID=0 PGID=0 HOME=/root\nfor init_script in /etc/cont-init.d/*.sh;\
    \ do\n  gow_log \"[ $${init_script}: executing... ]\"\n  source \"$${init_script}\"\
    \ndone\n# Normalize stale render-node entries (pre-card2 sessions) to card2.\n\
    \    sed -i 's|/dev/dri/renderD130|/dev/dri/card2|g' /mnt/data/wolf/cfg/config.toml\
    \ 2>/dev/null || true\n# wolf#465: force start_audio_server=true on the retained\
    \ Steam entry\nconfig=/mnt/data/wolf/cfg/config.toml\nif [[ -f \"$${config}\"\
    \ ]]; then\n  python3 - \"$${config}\" <<'PY'\nfrom pathlib import Path\nimport\
    \ sys\n\npath = Path(sys.argv[1])\nconfig = path.read_text()\nold = \"    start_audio_server\
    \ = false\\n    start_virtual_compositor = true\\n    title = 'Steam'\"\nif config.count(old)\
    \ == 1:\n    path.write_text(config.replace(old, old.replace('false', 'true',\
    \ 1), 1))\nPY\nfi\nchmod +x /opt/gow/startup.sh\nexec /opt/gow/startup.sh\n"
kind: ConfigMap
metadata:
  name: wolf-root-entrypoint
