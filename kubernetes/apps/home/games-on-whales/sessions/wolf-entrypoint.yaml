apiVersion: v1
data:
  entrypoint.sh: "#!/usr/bin/env bash\nset -e\nsource /opt/gow/bash-lib/utils.sh\n\
    export UNAME=root PUID=0 PGID=0 HOME=/root\nfor init_script in /etc/cont-init.d/*.sh;\
    \ do\n  gow_log \"[ $${init_script}: executing... ]\"\n  source \"$${init_script}\"\
    \ndone\n# The pinned Wolf fork predates games-on-whales/wolf#466: apps registered\n\
    # through /api/v1/apps/add persist start_audio_server=false. The Steam\n# entry\
    \ is retained on the PVC, so correct it before Wolf reads the config.\nconfig=/mnt/data/wolf/cfg/config.toml\n\
    if [[ -f \"$${config}\" ]]; then\n  python3 - \"$${config}\" <<'PY'\nfrom pathlib\
    \ import Path\nimport sys\n\npath = Path(sys.argv[1])\nconfig = path.read_text()\n\
    old = \"    start_audio_server = false\\n    start_virtual_compositor = true\\\
    n    title = 'Steam'\"\nif config.count(old) == 1:\n    path.write_text(config.replace(old,\
    \ old.replace('false', 'true', 1), 1))\nPY\nfi\nchmod +x /opt/gow/startup.sh\n\
    exec /opt/gow/startup.sh\n"
kind: ConfigMap
metadata:
  name: wolf-root-entrypoint
