---
# Discriminating probe for the black-screen bug (2026-10-03):
# sway (nested, plain wayland client) instead of gamescope.
#   - sway wallpaper/bar visible  -> wolf compositor client path OK -> gamescope negotiation is the bug
#   - sway also black             -> wolf compositor renders no client at all
# Same image as the steam app (base-app stack), only RUN_* differs.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: swaytest
spec:
  title: Sway Test
  id: 99
  isHDRSupported: false
  appAssetWebP: 
  template:
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: worker-04
      hostIPC: true
      containers:
      - name: app
        image: ghcr.io/games-on-whales/steam@sha256:4f88a5e363c783791fbbe432661d70d6775629fa8c74038b21622477cf20e0ab
        resources:
          requests:
            nvidia.com/gpu: '1'
            memory: 1Gi
          limits:
            nvidia.com/gpu: '1'
            memory: 8Gi
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
        env:
        - name: GBM_BACKENDS_PATH
          value: /usr/local/lib/gbm:/usr/lib/x86_64-linux-gnu/gbm
        - name: VK_DRIVER_FILES
          value: /etc/vulkan/icd.d/nvidia_icd.json
        - name: RUN_SWAY
          value: 'true'
        command:
        - /bin/bash
        - -ec
        - |
          # Same GPU mask + fail-fast assertion as the steam app (see steam.yaml).
          rm -f /dev/nvidia0 /dev/nvidia1 /dev/nvidia3 2>/dev/null || true
          dev=$$(readlink -f /sys/class/drm/renderD130/device 2>/dev/null || true)
          if [[ "$$dev" != *0000:46:00.0* ]]; then
            echo "FATAL: renderD130 maps to '$$dev', expected 0000:46:00.0" >&2
            exit 1
          fi
          nvis=$$(ls /dev/nvidia[0-9]* 2>/dev/null | wc -l)
          if [[ "$$nvis" != 1 ]]; then
            echo "FATAL: expected exactly 1 visible GPU, saw: $$(ls /dev/nvidia[0-9]* 2>/dev/null | tr '\n' ' ')" >&2
            exit 1
          fi
          echo "visible GPUs: $$(ls /dev/nvidia* | tr '\n' ' ')"
          until [ -S "$$XDG_RUNTIME_DIR/$$WAYLAND_DISPLAY" ]; do
            echo 'Waiting for Wayland socket'
            sleep 1
          done
          chown -R "$${PUID:-1000}:$${PGID:-1000}" /home/retro
          exec /entrypoint.sh
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: udev-data
          mountPath: /run/udev
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      tolerations:
      - key: dedicated
        operator: Equal
        value: special
        effect: NoSchedule
  wolfConfig:
    runtimeVariables:
      renderNode: /dev/dri/renderD130
