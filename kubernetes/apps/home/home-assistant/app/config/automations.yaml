# =============================================================================
# automations.yaml — UI-owned mirror snapshot (NOT deployed by Flux)
# =============================================================================
# This file is a point-in-time mirror of the live /config/automations.yaml on
# the home-assistant PVC, resynced manually after UI edits. It is NOT mounted
# by the ha-packages ConfigMap and NOT reconciled by Flux. Live edits happen
# via the HA UI; resync here for change history only.
# =============================================================================
- id: '1725206826847'
  alias: 'Front Door: Open/Closed Notifications'
  description: Notify only when the front door opens/closes
  triggers:
  - entity_id: binary_sensor.front_door_intrusion
    from: 'off'
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.front_door_intrusion
    from: 'on'
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.front_door_intrusion
        state: 'on'
      sequence:
      - data:
          message: 🚪 Front Door is OPEN
        action: notify.send_message
        target:
          entity_id: notify.device_phone_app_serena
      - data:
          message: 🚪 Front Door is OPEN
        action: notify.send_message
        target:
          entity_id: notify.rosebud_8_ha_app
    - conditions:
      - condition: state
        entity_id: binary_sensor.front_door_intrusion
        state: 'off'
      sequence:
      - data:
          message: ✅ Front Door is CLOSED
        action: notify.send_message
        target:
          entity_id: notify.device_phone_app_serena
      - data:
          message: ✅ Front Door is CLOSED
        action: notify.send_message
        target:
          entity_id: notify.rosebud_8_ha_app
  mode: single
- id: '1726631234652'
  alias: 'Garage: Garage door open for 15m'
  description: Daytime reminder; night hours are handled by the garage night watchdog.
  triggers:
  - trigger: state
    entity_id: cover.garage_garage_door_opener_ratgdo_door
    to: open
    for:
      hours: 0
      minutes: 15
      seconds: 0
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.house_mode
      state: night
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.device_phone_app_serena
    metadata: {}
    data:
      message: Garage Door has been open for 15m
  - action: notify.send_message
    target:
      entity_id: notify.rosebud_8_ha_app
    metadata: {}
    data:
      message: Garage door has been open for 15m
  mode: single
- id: '1762235354881'
  alias: 'Exterior Lights: Sunset & Sunrise'
  description: Exterior lights on 30 min before sunset, off 15 min after sunrise
  triggers:
  - event: sunset
    offset: -00:30:00
    id: sunset
    trigger: sun
  - event: sunrise
    offset: +00:15:00
    id: sunrise
    trigger: sun
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset
      sequence:
      - action: switch.turn_on
        target:
          entity_id: &id001
          - switch.exterior_lights_2
          - switch.on_off_switch
          - switch.s2_on_off_switch
    - conditions:
      - condition: trigger
        id: sunrise
      sequence:
      - action: switch.turn_off
        target:
          entity_id: *id001
  mode: single
- id: '1762547876019'
  alias: 'Kitchen: Fridge Power Loss Alert'
  description: Notify if fridge loses power (active power < 1 W for 10 min)
  triggers:
  - entity_id: sensor.kitchen_plugs_2_active_power
    below: 1
    for:
      minutes: 10
    trigger: numeric_state
  conditions: []
  actions:
  - data:
      message: ⚠️ Fridge power has been below 1 W for 10 minutes — check if it lost
        power.
    action: notify.send_message
    target:
      entity_id: notify.device_phone_app_serena
  - data:
      message: ⚠️ Fridge power has been below 1 W for 10 minutes — check if it lost
        power.
    action: notify.send_message
    target:
      entity_id: notify.rosebud_8_ha_app
  mode: single
- id: '1764545816552'
  alias: 'Garage Entry: Open/Closed Notifications'
