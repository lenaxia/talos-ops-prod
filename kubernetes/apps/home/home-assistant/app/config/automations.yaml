  mode: single
- id: '1764546635805'
  alias: 'Laundry: Motion Lights'
  description: Turn on laundry lights when motion is detected, turn off after 5 minutes
    of no motion
  triggers:
  - entity_id: binary_sensor.laundry_motion_detected
    from: 'off'
    to: 'on'
    trigger: state
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.laundry_light
    data: {}
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.laundry_motion_detected
      from:
      - 'on'
      to:
      - 'off'
      for:
        hours: 0
        minutes: 2
        seconds: 30
      trigger: state
  - action: switch.turn_off
    target:
      entity_id: switch.laundry_light
    data: {}
  mode: restart
- id: '1783706489856'
  alias: ReSpeaker Kitchen -> Sonos TTS
  description: Play assistant TTS responses on Sonos with ducking (announce API)
  triggers:
  - event_type: esphome.tts_uri
    event_data:
      device_id: 03eff58ab24c18db7ddb45320e7770a7
    trigger: event
  conditions: []
  actions:
  - action: media_player.play_media
    data:
      announce: true
      media:
        media_content_id: '{{ trigger.event.data.uri }}'
        media_content_type: music
        metadata: {}
    target:
      entity_id: media_player.dining_room_dining_room
  mode: single
- id: '1783726000001'
  alias: 'RF Remote: Bedroom WLED Skylar'
  description: Sonoff RF Bridge 433MHz keyfob (A/B/C/D) controlling WLED.Skylar
  triggers:
  - trigger: mqtt
    topic: tele/tasmota/RESULT
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json.RfReceived is defined and\n   trigger.payload_json.RfReceived.Data\
      \ in [11855016, 11855012, 11855010, 11855009] }}"
  actions:
  - variables:
      code: '{{ trigger.payload_json.RfReceived.Data }}'
      light: light.bedroom_wled_skylar
      colors:
      - - 255
        - 0
        - 0
      - - 255
        - 200
        - 0
      - - 0
        - 255
        - 0
      - - 0
        - 80
        - 255
      - - 160
        - 0
        - 255
      - - 255
        - 255
        - 255
      - - 255
        - 160
        - 60
      brightness_levels:
      - 25
      - 50
      - 75
      - 100
  - choose:
    - conditions: '{{ code == 11855016 }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: '{{ light }}'
    - conditions: '{{ code == 11855012 }}'
      sequence:
      - variables:
          current: '{{ state_attr(light, "rgb_color") | list if state_attr(light,
            "rgb_color") else [0,0,0] }}'
          idx: "{% set ns = namespace(found=-1) %} {% for c in colors %}\n  {% if\
            \ c == current %}{% set ns.found = loop.index0 %}{% endif %}\n{% endfor\
            \ %} {{ ns.found }}"
          nxt: '{{ colors[(idx | int + 1) % (colors | length)] }}'
      - action: light.turn_on
        target:
          entity_id: '{{ light }}'
        data:
          rgb_color: '{{ nxt }}'
          brightness_pct: 80
          effect: Solid
    - conditions: '{{ code == 11855010 }}'
      sequence:
      - variables:
          cur_b: '{{ (state_attr(light, "brightness") | float(0) / 255 * 100) | round(0)
            }}'
          idx: "{% set ns = namespace(found=-1) %} {% for b in brightness_levels %}\n\
            \  {% if (cur_b | int) <= b %}{% if ns.found == -1 %}{% set ns.found =\
            \ loop.index0 %}{% endif %}{% endif %}\n{% endfor %} {{ ns.found }}"
          nxt_b: '{{ brightness_levels[((idx | int) + 1) % (brightness_levels | length)]
            if idx | int >= 0 else brightness_levels[0] }}'
      - action: light.turn_on
        target:
          entity_id: '{{ light }}'
        data:
          brightness_pct: '{{ nxt_b }}'
    - conditions: '{{ code == 11855009 }}'
      sequence:
      - variables:
          cur_b: '{{ (state_attr(light, "brightness") | float(0) / 255 * 100) | round(0)
            }}'
          cur_rgb: '{{ state_attr(light, "rgb_color") | list if state_attr(light,
            "rgb_color") else [0,0,0] }}'
          is_red: '{{ cur_rgb == [255, 0, 0] }}'
          nxt_b: '{{ 20 if (is_red and (cur_b | int) <= 15) else 10 }}'
      - action: light.turn_on
        target:
          entity_id: '{{ light }}'
        data:
          rgb_color:
          - 255
          - 0
          - 0
          brightness_pct: '{{ nxt_b }}'
          effect: Solid
  mode: single
