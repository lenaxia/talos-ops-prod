# =============================================================================
# Master bed nightlight package — WLED path lighting driven by bed presence
# =============================================================================
# WLED.master_bed (light.wled_gledopto) segments in HA:
#   segment_1 = Serena Headboard      segment_2 = Serena Ground
#   segment_3 = Mike Headboard        (future: Mike Ground -> append below)
#
# Behavior:
#   ON : motion in the master bedroom AND main lights off AND dark
#        (dark = after sunset & before sunrise [single sun condition], OR
#        blinds <= 20% closed) -> light ONLY the segments of people who are
#        OUT of bed. Nobody in bed -> all segments. Both in bed -> nothing
#        (see "unknown mover" below).
#   Scene by time bucket:
#     evening (sunset-23:00)  30% warm amber  [255,160,0]
#     deep night (23:00-05:00) 10% deep red   [255,40,0]
#     dawn (05:00-sunrise)     20% warm white [255,190,140]
#   OFF: motion clear 3 min / main lights on / both back in bed 5 min /
#        blinds opened past 50%.
#
# Bed-sensor semantics (Withings mats, ~1 s register, can bounce on
# roll-overs):
#   - A person is "OUT" if their mat has been off for >= side_debounce
#     (15 s), or the mat is unavailable/unknown (dead sensor never leaves
#     a real walker in the dark). Consequences of the debounce: a mat that
#     bounced off < 15 s ago (roll-over) counts as IN BED, so the sleeper's
#     side stays dark; a REAL get-up is also "in bed" for the first 15 s,
#     so their side starts dark and lights on the next PIR re-trigger
#     (PIR fires repeatedly while walking). Drop side_debounce to 0 when
#     bedside PIR/mmWave sensors are added under the nightstands.
#   - The room PIR cannot see someone under covers, so the motion trigger
#     itself is the primary roll-over guard.
#   - "Unknown mover": motion while BOTH mats read in-bed (debounced)
#     lights nothing — protects sleepers from pet/false triggers. A real
#     get-up resolves in seconds: the mat flips, continued motion
#     re-triggers, and the correct side lights.
#
# Manual override: input_boolean.master_bed_nightlight_auto off = stand down.
# =============================================================================

master_bed_nightlight:

  input_boolean:
    master_bed_nightlight_auto:
      name: Master Bed Nightlight Auto
      icon: mdi:lightbulb-night
      initial: false   # avoid surprise activation on first deploy; enable in UI

  automation:
    # -------------------------------------------------------------------------
    - id: master_bed_nightlight_on
      alias: "MASTER BED: Nightlight on — motion in the dark"
      description: >
        Motion in the master bedroom while dark and the main lights are off:
        light the bed segments of whoever is out of bed, scene by time.
      triggers:
        - trigger: state
          entity_id: binary_sensor.motion_sensor_gen2_motion_detection
          to: "on"
      conditions:
        - condition: state
          entity_id: input_boolean.master_bed_nightlight_auto
          state: "on"
        - condition: state
          entity_id: light.master_bedroom_lights
          state: "off"
        # dark: after sunset & before sunrise (single condition — HA only
        # OR-s the midnight wrap inside ONE sun condition), OR blinds drawn
        - condition: or
          conditions:
            - condition: sun
              after: sunset
              before: sunrise
            - condition: numeric_state
              entity_id: cover.master_blinds
              attribute: current_position   # cover state is a string; position is an attribute
              below: 21                      # <= 20 (mostly drawn)
      variables:
        # --- segment map (future Mike Ground: append to mike_segments) ---
        serena_segments:
          - light.master_bedroom_wled_master_bed_segment_1  # Serena Headboard
          - light.master_bedroom_wled_master_bed_segment_2  # Serena Ground
        mike_segments:
          - light.master_bedroom_wled_master_bed_segment_3  # Mike Headboard
        side_debounce: 15
        # -------------------------------------------------------------------
        serena_out: >
          {% set mat = states.binary_sensor.master_bedroom_serenawithings_in_bed %}
          {{ (mat.state == 'off'
              and (now() - mat.last_changed).total_seconds() >= side_debounce)
             or mat.state in ['unavailable', 'unknown'] }}
        mike_out: >
          {% set mat = states.binary_sensor.master_bedroom_mikewithings_in_bed %}
          {{ (mat.state == 'off'
              and (now() - mat.last_changed).total_seconds() >= side_debounce)
             or mat.state in ['unavailable', 'unknown'] }}
      actions:
        # unknown mover: both in bed (debounced) -> light nothing
        - if:
            - condition: template
              value_template: "{{ not serena_out and not mike_out }}"
          then:
            - stop: ""
        - variables:
            targets: >
              {{ (serena_segments if serena_out else [])
                 + (mike_segments if mike_out else []) | list }}
        # scene by time bucket
        - choose:
            - conditions:
                - condition: or
                  conditions:
                    - condition: time
                      after: "23:00:00"
                    - condition: time
                      before: "05:00:00"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ targets }}"
                  data:
                    brightness_pct: 10
                    rgb_color: [255, 40, 0]
            - conditions:
                - condition: time
                  after: "05:00:00"
                - condition: sun
                  before: sunrise
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ targets }}"
                  data:
                    brightness_pct: 20
                    rgb_color: [255, 190, 140]
            - conditions:
                - condition: sun
                  after: sunset
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ targets }}"
                  data:
                    brightness_pct: 30
                    rgb_color: [255, 160, 0]
            # default: evening scene. Covers the summer edge where sunrise is
            # before 05:00 (dawn bucket cannot match) and a blinds-dark
            # morning falls through -- light warm rather than nothing.
          default:
            - action: light.turn_on
              target:
                entity_id: "{{ targets }}"
              data:
                brightness_pct: 30
                rgb_color: [255, 160, 0]
      mode: restart

    # -------------------------------------------------------------------------
    - id: master_bed_nightlight_off
      alias: "MASTER BED: Nightlight off"
      description: >
        Fade the nightlight out when motion has been clear for 3 minutes,
        the main lights come on, everyone is back in bed for 5 minutes, or
        the blinds open (morning).
      triggers:
        - trigger: state
          entity_id: binary_sensor.motion_sensor_gen2_motion_detection
          to: "off"
          for: "00:03:00"
          id: motion_clear
        - trigger: state
          entity_id: light.master_bedroom_lights
          to: "on"
          id: main_lights
        - trigger: state
          entity_id: binary_sensor.master_bedroom_serenawithings_in_bed
          to: "on"
          for: "00:05:00"
          id: serena_asleep
        - trigger: state
          entity_id: binary_sensor.master_bedroom_mikewithings_in_bed
          to: "on"
          for: "00:05:00"
          id: mike_asleep
        - trigger: numeric_state
          entity_id: cover.master_blinds
          attribute: current_position   # position attribute, not the string state
          above: 50
          id: blinds_open
        # watchdog: a segment stuck on 30+ min with the PIR quiet or dead
        # (stuck-on Z-Wave PIR would otherwise keep the nightlight on all
        # night). Genuine continuous presence keeps the PIR re-triggering,
        # so the for-5-min-off condition stays false and lights persist.
        - trigger: state
          entity_id:
            - light.master_bedroom_wled_master_bed_segment_1
            - light.master_bedroom_wled_master_bed_segment_2
            - light.master_bedroom_wled_master_bed_segment_3
          to: "on"
          for: "00:30:00"
          id: watchdog
      conditions:
        - condition: state
          entity_id: input_boolean.master_bed_nightlight_auto
          state: "on"
      actions:
        # only "everyone back in bed" turns things off; the other triggers
        # are unconditional stoppers
        - if:
            - condition: trigger
              id:
                - serena_asleep
                - mike_asleep
          then:
            - condition: and
              conditions:
                - condition: state
                  entity_id: binary_sensor.master_bedroom_serenawithings_in_bed
                  state: "on"
                - condition: state
                  entity_id: binary_sensor.master_bedroom_mikewithings_in_bed
                  state: "on"
        - action: light.turn_off
          target:
            entity_id:
              - light.master_bedroom_wled_master_bed_segment_1
              - light.master_bedroom_wled_master_bed_segment_2
              - light.master_bedroom_wled_master_bed_segment_3
          data:
            transition: 3
      mode: single
