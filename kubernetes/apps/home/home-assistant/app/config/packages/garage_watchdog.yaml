# =============================================================================
# Garage night watchdog package
# =============================================================================
# Never wake up to an open garage again.
#
# While house mode is 'night' (21:30–06:30, or after a manual goodnight):
#   - garage open for 20 min, or mode turns night with garage open
#     -> time-sensitive push with [Close garage] and [Keep open] buttons
#     -> 15 min later, if still open and not snoozed: CLOSE IT automatically
#
# "Keep open" snoozes the watchdog until the next 09:00 (working on the car,
# hot night, etc). The [Close garage] button reuses the CLOSE_GARAGE handler
# from the presence_experience package.
#
# Bed sensors (Withings in_bed) act as a second wake path, gated: only
# 22:00–07:00, only with BOTH master bedroom lights off (ceiling dimmer and
# the outlet lamp), and only when every AVAILABLE in-bed sensor has been on
# for 20 minutes (afternoon nap, forgot the mode). Unavailable/unknown
# sensors (e.g. a mat still offline) are excluded rather than blocking.
# Auto-close outside night mode requires BOTH sensors explicitly 'on' —
# partial knowledge only earns an alert, never an automatic close.
#
# Area-in-use guard (North Garage Reolink): if motion, person, or vehicle
# detection is active, the watchdog stands down entirely; when activity
# clears for 5 minutes it re-evaluates. The driveway is re-checked in the
# final moment before closing too. Vehicle detection is deliberately NOT
# part of the guard — a car parked in frame would latch it on all night
# and silently disable the watchdog. (Person/motion are transient events;
# vehicles are often static.)
# A camera that goes offline fails the guard OPEN (watchdog proceeds) by
# design — a dead camera must not wedge the door protection permanently.
# =============================================================================

garage_watchdog:

  input_datetime:
    garage_watchdog_snooze_until:
      name: Garage Watchdog Snoozed Until
      has_date: true
      has_time: true
      icon: mdi:garage-alert

  automation:
    # -------------------------------------------------------------------------
    - id: garage_watchdog_night
      alias: "GARAGE: Night watchdog"
      description: >
        Open garage during night mode -> actionable alert -> auto-close after
        15 minutes if nobody responded. Snoozable until 09:00.
      triggers:
        - trigger: state
          entity_id: cover.garage_garage_door_opener_ratgdo_door
          to: "open"
          for: "00:20:00"
        - trigger: state
          entity_id: input_select.house_mode
          to: night
        - trigger: state
          entity_id:
            - binary_sensor.master_bedroom_mikewithings_in_bed
            - binary_sensor.master_bedroom_serenawithings_in_bed
          to: "on"
          for: "00:20:00"
        # re-evaluate once driveway activity settles
        - trigger: state
          entity_id:
            - binary_sensor.north_garage_motion
            - binary_sensor.north_garage_person
          to: "off"
          for: "00:05:00"
        # re-arm the bed path if its 20-minute trigger completed before the
        # 22:00 window / lights-out (in-bed fires once per continuous period)
        - trigger: state
          entity_id:
            - light.master_bedroom_lights
            - light.master_bedroom_outlet
          to: "off"
        - trigger: time
          at: "22:00:00"
      conditions:
        - condition: state
          entity_id: cover.garage_garage_door_opener_ratgdo_door
          state: open
        - condition: template
          value_template: >
            {{ now().timestamp() >
               (states('input_datetime.garage_watchdog_snooze_until') | as_timestamp(0)) }}
        # area in use -> stand down (motion/person/vehicle on the North Garage camera)
        - condition: template
          value_template: >
            {{ not (is_state('binary_sensor.north_garage_motion', 'on')
                   or is_state('binary_sensor.north_garage_person', 'on')) }}
        - condition: template
          value_template: >
            {% set beds = [
               states('binary_sensor.master_bedroom_mikewithings_in_bed'),
               states('binary_sensor.master_bedroom_serenawithings_in_bed')] %}
            {% set avail = beds | select('in', ['on', 'off']) | list %}
            {% set bed_window = now().hour >= 22 or now().hour < 7 %}
            {% set bedroom_dark = is_state('light.master_bedroom_lights', 'off')
               and is_state('light.master_bedroom_outlet', 'off') %}
            {{ is_state('input_select.house_mode', 'night')
               or (bed_window and bedroom_dark
                   and avail | count > 0
                   and avail | select('eq', 'on') | list | count == avail | count) }}
      actions:
        - variables:
            auto_close_allowed: >
              {{ is_state('input_select.house_mode', 'night')
                 or (is_state('binary_sensor.master_bedroom_mikewithings_in_bed', 'on')
                     and is_state('binary_sensor.master_bedroom_serenawithings_in_bed', 'on')) }}
        - action: notify.send_message
          target:
            entity_id:
              - notify.device_phone_app_serena
              - notify.rosebud_8_ha_app
          data:
            title: "Garage is open — night watchdog"
            message: >
              The garage door is open and everyone should be asleep.
              {% if auto_close_allowed %}
              It will close automatically in 15 minutes.
              {% else %}
              Auto-close is withheld — not every sleep sensor confirms everyone is in bed.
              {% endif %}
            data:
              push:
                interruption-level: time-sensitive
              actions:
                - action: CLOSE_GARAGE
                  name: Close garage now
                - action: KEEP_GARAGE_OPEN
                  name: Keep it open tonight
        - wait_for_trigger:
            - trigger: state
              entity_id: cover.garage_garage_door_opener_ratgdo_door
              to: closed
          timeout: "00:15:00"
        - if:
            - condition: template
              value_template: "{{ wait.completed == false and auto_close_allowed }}"
          then:
            - condition: state
              entity_id: cover.garage_garage_door_opener_ratgdo_door
              state: open
            # re-check the driveway right before closing — someone may have
            # stepped out during the 15-minute wait
            - if:
                - condition: template
                  value_template: >
                    {{ is_state('binary_sensor.north_garage_motion', 'on')
                       or is_state('binary_sensor.north_garage_person', 'on') }}
              then:
                - action: notify.send_message
                  target:
                    entity_id:
                      - notify.device_phone_app_serena
                      - notify.rosebud_8_ha_app
                  data:
                    title: "Garage auto-close deferred"
                    message: >
                      Activity at the North Garage camera — the watchdog is
                      standing by and will retry when the area is clear.
              else:
                - action: cover.close_cover
                  target:
                    entity_id: cover.garage_garage_door_opener_ratgdo_door
                - action: notify.send_message
                  target:
                    entity_id:
                      - notify.device_phone_app_serena
                      - notify.rosebud_8_ha_app
                  data:
                    title: "Garage closed automatically"
                    message: >
                      The garage door was still open and was closed by the night
                      watchdog. Door is now {{ states('cover.garage_garage_door_opener_ratgdo_door') }}.
      mode: single

    # -------------------------------------------------------------------------
    - id: garage_watchdog_keep_open_button
      alias: "GARAGE: Keep-open snooze button"
      description: Handles the KEEP_GARAGE_OPEN actionable-notification button.
      triggers:
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: KEEP_GARAGE_OPEN
      actions:
        - variables:
            snooze_until: >
              {% set base = now().replace(hour=9, minute=0, second=0, microsecond=0) %}
              {{ (base if now() < base else base + timedelta(days=1)).strftime('%Y-%m-%d %H:%M:%S') }}
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.garage_watchdog_snooze_until
          data:
            datetime: "{{ snooze_until }}"
        - action: notify.send_message
          target:
            entity_id:
              - notify.device_phone_app_serena
              - notify.rosebud_8_ha_app
          data:
            title: "Garage watchdog snoozed"
            message: "The garage will be left open until {{ snooze_until }}. Good night."
      mode: single
