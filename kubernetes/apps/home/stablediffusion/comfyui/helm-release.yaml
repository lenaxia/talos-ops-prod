---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app comfyui
  namespace: &namespace home
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 4
      strategy: rollback
  values:
    configMaps:
      prestart:
        enabled: true
        data:
          pre-start.sh: |
            #!/bin/sh
            # Keep ComfyUI current at boot (baked copy is v0.3.75 / 2025-11).
            # NOTE: no `git clean` — custom_nodes/ is an NFS mountpoint.
            echo "[pre-start] Updating ComfyUI from origin/master..."
            cd /root/ComfyUI
            if git fetch --quiet origin master \
               && git reset --hard --quiet origin/master; then
              echo "[pre-start] ComfyUI now at: $(git rev-parse --short HEAD) $(git log -1 --format=%cs)"
            else
              echo "[pre-start] WARN: git update failed, using baked version"
            fi
            # requirements.txt excludes torch/torchvision — delta install only
            pip install --quiet --root-user-action=ignore -r requirements.txt \
              || echo "[pre-start] WARN: pip install failed"
          set-proxy.sh: |
            #!/bin/sh
            # no-op — mounted read-only from ConfigMap
    controllers:
      comfyui:
        type: deployment
        # 2026-08-21: scaled to 0 — all 4 GPUs on worker-04 allocated
        # (3x vLLM + games-on-whales spare 3090).
        # 2026-10-12: back to 1 — GOW operator scaled to 0, GPU
        # GPU-755d8528 reclaimed. Switched primary model to Krea 2
        # Turbo fp8 (see models/diffusion_models on the NFS share).
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          prepare-scripts:
            image:
              repository: docker.io/library/alpine
              tag: "3.21"
            command: ["/bin/sh", "-c"]
            args:
              - cp /prestart/*.sh /root/user-scripts/ && chmod +x /root/user-scripts/*.sh && ls -l /root/user-scripts
        pod:
          runtimeClassName: nvidia
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "special"
              effect: "NoSchedule"
            - key: "node.kubernetes.io/disk-pressure"
              operator: "Exists"
              effect: "NoSchedule"
        containers:
          app:
            image:
              repository: ghcr.io/lenaxia/comfyui-boot
              tag: cu124-slim-20251127@sha256:0ce1e0c5ed53888e94ba1e551516fa7e60f0bed701e39af0d96393a33e987dc8
            env:
              - name: NVIDIA_VISIBLE_DEVICES
                # 3090 #3 — reclaimed from games-on-whales 2026-10-12
                # (direwolf operator scaled to 0). Must stay at replicas: 0
                # for GOW sessions while this runs.
                value: "GPU-755d8528-c8c7-5fd4-f441-f061368f4547" # 3090 #3
              - name: PORT
                value: "8188"
              - name: CLI_ARGS
                value: "--listen 0.0.0.0 --port 8188"
              - name: LD_PRELOAD
                value: "/usr/lib64/libjpeg.so.8"
              - name: LD_LIBRARY_PATH
                value: "/usr/local/lib64/python3.12/site-packages/torch/lib:/usr/local/lib/python3.12/site-packages/nvidia/cublas/lib:/usr/local/lib/python3.12/site-packages/nvidia/cudnn/lib"
            securityContext:
              runAsUser: 0
              privileged: false
            probes:
              # Slow boot by design: pre-start.sh git-updates ComfyUI +
              # pip installs before the HTTP server binds :8188. Without
              # this probe the helm rollout wait times out mid-boot.
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 8188
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 8188
                  periodSeconds: 30
                  timeoutSeconds: 5
            resources:
              requests:
                nvidia.com/gpu: 1
                cpu: 2000m
                memory: 8Gi
              limits:
                # Krea 2 Turbo fp8 (~13G) + Qwen3-VL 4B fp8 (~5G) weights
                # are mmap'd through RAM before/during GPU upload.
                memory: 24Gi
                nvidia.com/gpu: 1
    service:
      app:
        controller: comfyui
        ports:
          http:
            port: 8188
    ingress:
      main:
        enabled: true
        annotations:
          hajimari.io/enable: 'true'
          hajimari.io/visible-groups: 'administrators'
          hajimari.io/icon: mdi:image-frame
          hajimari.io/info: *app
          hajimari.io/group: Home
          cert-manager.io/cluster-issuer: letsencrypt-production
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: networking-chain-authelia@kubernetescrd
        hosts:
          - host: &uri comfy.${SECRET_DEV_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *uri
            secretName: *uri
    persistence:
      # Boot-time self-update hook for the comfyui-boot image (the image
      # bakes ComfyUI at build time — v0.3.75, too old for Krea 2).
      # The entrypoint chmod+x'es and sources /root/user-scripts/*.sh,
      # so they must be WRITABLE — a ConfigMap mount is always read-only.
      # initContainer copies them from the ConfigMap into an emptyDir.
      user-scripts:
        type: emptyDir
        advancedMounts:
          comfyui:
            prepare-scripts: &usscriptsmount
              - path: /root/user-scripts
            app: *usscriptsmount
      prestart-cm:
        type: configMap
        identifier: prestart
        advancedMounts:
          comfyui:
            prepare-scripts:
              - path: /prestart
      models:
        type: nfs
        server: ${NAS_ADDR}
        path: /volume2/downloads/stablediffusion/models
        globalMounts:
          - path: /root/ComfyUI/models
      output:
        type: nfs
        server: ${NAS_ADDR}
        path: /volume2/downloads/stablediffusion/output
        globalMounts:
          - path: /root/ComfyUI/output
      custom-nodes:
        type: nfs
        server: ${NAS_ADDR}
        path: /volume2/downloads/stablediffusion/custom_nodes
        globalMounts:
          - path: /root/ComfyUI/custom_nodes
      input:
        type: nfs
        server: ${NAS_ADDR}
        path: /volume2/downloads/stablediffusion/input
        globalMounts:
          - path: /root/ComfyUI/input
      config:
        type: configMap
        name: comfyui-configmap
        advancedMounts:
          comfyui:
            app:
              - path: /root/ComfyUI/custom_nodes/ComfyUI-Manager/config.ini
                subPath: config.ini
                readOnly: true
