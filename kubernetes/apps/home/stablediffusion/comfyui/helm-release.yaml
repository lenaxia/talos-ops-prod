---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app comfyui
  namespace: &namespace home
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 4
      strategy: rollback
  values:
    controllers:
      comfyui:
        type: deployment
        # scaled to 0 2026-08-21: unschedulable — all 4 GPUs on worker-04
        # allocated to vllm pods and node memory requests at 95%
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          runtimeClassName: nvidia
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "special"
              effect: "NoSchedule"
            - key: "node.kubernetes.io/disk-pressure"
              operator: "Exists"
              effect: "NoSchedule"
        containers:
          app:
            image:
              repository: ghcr.io/lenaxia/comfyui-boot
              tag: cu124-slim-20251127@sha256:0ce1e0c5ed53888e94ba1e551516fa7e60f0bed701e39af0d96393a33e987dc8
            env:
              - name: NVIDIA_VISIBLE_DEVICES
                value: "GPU-755d8528-c8c7-5fd4-f441-f061368f4547" # 3090 #3 (spare)
              - name: PORT
                value: "8188"
              - name: CLI_ARGS
                value: "--listen 0.0.0.0 --port 8188"
              - name: LD_PRELOAD
                value: "/usr/lib64/libjpeg.so.8"
              - name: LD_LIBRARY_PATH
                value: "/usr/local/lib64/python3.12/site-packages/torch/lib:/usr/local/lib/python3.12/site-packages/nvidia/cublas/lib:/usr/local/lib/python3.12/site-packages/nvidia/cudnn/lib"
            securityContext:
              runAsUser: 0
              privileged: false
            resources:
              requests:
                nvidia.com/gpu: 1
                cpu: 2000m
                memory: 4Gi
              limits:
                memory: 4Gi
                nvidia.com/gpu: 1
    service:
      app:
        controller: comfyui
        ports:
          http:
            port: 8188
    ingress:
      main:
        enabled: true
        annotations:
          hajimari.io/enable: 'true'
          hajimari.io/icon: baby-bottle-outline
          hajimari.io/info: *app
          hajimari.io/group: *namespace
          cert-manager.io/cluster-issuer: letsencrypt-production
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: networking-chain-authelia@kubernetescrd
        hosts:
          - host: &uri comfy.${SECRET_DEV_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *uri
            secretName: *uri
    persistence:
      models:
        type: nfs
        server: ${NAS_ADDR}
        path: /volume2/downloads/stablediffusion/models
        globalMounts:
          - path: /root/ComfyUI/models
      output:
        type: nfs
        server: ${NAS_ADDR}
        path: /volume2/downloads/stablediffusion/output
        globalMounts:
          - path: /root/ComfyUI/output
      custom-nodes:
        type: nfs
        server: ${NAS_ADDR}
        path: /volume2/downloads/stablediffusion/custom_nodes
        globalMounts:
          - path: /root/ComfyUI/custom_nodes
      input:
        type: nfs
        server: ${NAS_ADDR}
        path: /volume2/downloads/stablediffusion/input
        globalMounts:
          - path: /root/ComfyUI/input
      config:
        type: configMap
        name: comfyui-configmap
        advancedMounts:
          comfyui:
            app:
              - path: /root/ComfyUI/custom_nodes/ComfyUI-Manager/config.ini
                subPath: config.ini
                readOnly: true
