# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname mamahuhu-ocr
  namespace: &namespace home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'

    controllers:
      app:
        type: deployment
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            # RapidOCR (PaddleOCR PP-OCRv4 mobile, ONNX CPU) HTTP service for
            # mamahuhu's OCR ladder. Cluster-internal only — no ingress.
            # OpenVINO/iGPU upgrade path: switch to the -openvino build and add
            # gpu.intel.com/i915 limits (frigate pattern) once measured.
            image:
              repository: ghcr.io/lenaxia/mamahuhu-ocr
              fa21169fc357612e97fe2605084b0bde607613f5
            env:
              - name: TZ
                value: ${TIMEZONE}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 5
                  timeoutSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  failureThreshold: 3
                  timeoutSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  failureThreshold: 30
                  timeoutSeconds: 10
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 2Gi

    service:
      app:
        controller: app
        primary: true
        type: ClusterIP
        ports:
          http:
            port: 8000
