# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname vllm-classifier
  namespace: &namespace home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 10
  upgrade:
    timeout: 15m
    remediation:
      retries: 10
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "special"
          effect: "NoSchedule"
    controllers:
      a:
        type: deployment
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: vllm/vllm-openai
              tag:
                v0.27.1@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
            command: ["/bin/sh", "-c"]
            args:
              - |
                vllm serve \
                    cyankiwi/Qwen3-30B-A3B-Instruct-2507-AWQ-4bit \
                    --served-model-name classifier \
                    --max-model-len 16384 \
                    --max-num-seqs 64 \
                    --max-num-batched-tokens 16384 \
                    --gpu-memory-utilization 0.9863 \
                    --kv-cache-dtype fp8 \
                    --tensor-parallel-size 1 \
                    --trust-remote-code \
                    --enable-auto-tool-choice \
                    --tool-call-parser hermes \
                    --host 0.0.0.0 \
                    --port 8000 \
                    --dtype auto \
                    --enable-chunked-prefill \
                    --enable-prefix-caching \
                    --enable-log-requests
            env: &env
              - name: TZ
                value: ${TIMEZONE}
              - name: NVIDIA_VISIBLE_DEVICES
                value: "GPU-bec81ab7-67a6-cfeb-98d0-dd3f8599e337" # 3090 FE
              - name: VLLM_USE_MODELSCOPE
                value: "false"
            envFrom:
              - secretRef:
                  name: *appname
            probes: &probes
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 300
                  periodSeconds: 30
                  successThreshold: 1
                  failureThreshold: 5
                  timeoutSeconds: 10
              readiness: *probe
            resources: &resources
              requests:
                nvidia.com/gpu: "1"
                memory: "16Gi"
              limits:
                nvidia.com/gpu: "1"
                memory: "22Gi"
      b:
        type: deployment
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: vllm/vllm-openai
              tag:
                v0.27.1@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
            command: ["/bin/sh", "-c"]
            args:
              - |
                vllm serve \
                    cyankiwi/Qwen3-30B-A3B-Instruct-2507-AWQ-4bit \
                    --served-model-name classifier \
                    --max-model-len 16384 \
                    --max-num-seqs 64 \
                    --max-num-batched-tokens 16384 \
                    --gpu-memory-utilization 0.9863 \
                    --kv-cache-dtype fp8 \
                    --tensor-parallel-size 1 \
                    --trust-remote-code \
                    --enable-auto-tool-choice \
                    --tool-call-parser hermes \
                    --host 0.0.0.0 \
                    --port 8000 \
                    --dtype auto \
                    --enable-chunked-prefill \
                    --enable-prefix-caching \
                    --enable-log-requests
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: NVIDIA_VISIBLE_DEVICES
                value: "GPU-6726851a-d64e-09c8-a938-1537593e3106" # 3090 Zotac
              - name: VLLM_USE_MODELSCOPE
                value: "false"
            envFrom:
              - secretRef:
                  name: *appname
            probes: *probes
            resources: *resources

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: /root/.cache/huggingface
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Gi
        globalMounts:
          - path: /dev/shm
    service:
      app:
        enabled: false
    rawResources:
      shared-svc:
        enabled: true
        forceRename: vllm-classifier
        manifest:
          apiVersion: v1
          kind: Service
          metadata:
            labels:
              app.kubernetes.io/name: vllm-classifier
              app.kubernetes.io/instance: vllm-classifier
          spec:
            type: LoadBalancer
            loadBalancerIP: ${SVC_VLLM_CLASSIFIER_IP}
            selector:
              app.kubernetes.io/name: vllm-classifier
              app.kubernetes.io/instance: vllm-classifier
            ports:
              - name: http
                port: 8000
                targetPort: 8000
                protocol: TCP
