---
# One-shot retag job: re-tags EVERY user's mamahuhu entries with the current
# tagger prompt (dist/retag.js — all-users via direct SQL since v0.4.4).
#
# Runs to completion and STAYS (no ttlSecondsAfterFinished — TTL-deleting the
# Job would make Flux recreate and re-run it, burning gateway calls).
# Job specs are immutable: to ship a new retag run, bump BOTH the image here
# AND the Job name suffix (…-v2 → …-v3) so Flux prunes the completed Job and
# creates the new one — no manual kubectl needed.
# FORCE=0 would only fill untagged entries; default re-tags everything.
apiVersion: batch/v1
kind: Job
metadata:
  name: mamahuhu-retag-v2
  namespace: home
  labels:
    app.kubernetes.io/name: mamahuhu
    app.kubernetes.io/instance: mamahuhu
    app.kubernetes.io/component: retag
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mamahuhu
        app.kubernetes.io/component: retag
    spec:
      restartPolicy: Never
      # the PVC is RWO — pin to whatever node runs the app pod so both can
      # mount it (sqlite WAL handles the two-process access)
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mamahuhu
                  app.kubernetes.io/component: app
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: retag
          image: ghcr.io/lenaxia/mamahuhu:0.4.4
          command: ["node", "dist/retag.js"]
          env:
            - name: DATA_DIR
              value: /data
            - name: OPENAI_API_BASE
              value: https://ai.${SECRET_DEV_DOMAIN}/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mamahuhu
                  key: litellm-api-key
            - name: MODEL_CHAT
              value: default
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mamahuhu-data
