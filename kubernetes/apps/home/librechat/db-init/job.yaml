---
# Provisions the `ragapi` role + database + pgvector extension on the
# dedicated `ragpg` CloudNative-PG cluster, following the llmsafespaces
# db-init pattern (role password sourced from the app-namespace SOPS
# secret so only one copy of the credential exists).
#
# Uses the CNPG postgres image (psql available) instead of
# onedr0p/postgres-init because the pgvector extension must also be
# created. CREATE DATABASE / CREATE ROLE can't run inside a transaction,
# hence the \gexec idempotency pattern instead of DO blocks.
#
# FLUX SUBSTITUTION WARNING (same class of bug as the librechat
# config-rewrite sentinel): post-build envsubst in strict mode scans the
# ENTIRE manifest text — never write dollar-brace tokens, bare $VAR
# references, or dollar-quoted SQL tags ($tag$) in this file. Superuser
# credentials ride in via the standard PG* env vars, the app password
# via printenv inside $(...) command substitution, which envsubst
# ignores. Re-runs are idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: librechat-ragapi-postgres-init
  namespace: home
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: librechat-ragapi-postgres-init
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      containers:
        - name: postgres-init
          image: ghcr.io/cloudnative-pg/postgresql:16.15
          env:
            # psql reads these natively — no connection string needed.
            - name: PGHOST
              value: ragpg-rw.databases.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            - name: APP_PASS
              valueFrom:
                secretKeyRef:
                  name: ragapi-credentials
                  key: postgres-password
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              psql -v ON_ERROR_STOP=1 -v pass="$(printenv APP_PASS)" <<'SQL'
              SELECT 'CREATE ROLE ragapi LOGIN'
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ragapi')\gexec
              ALTER ROLE ragapi WITH LOGIN PASSWORD :'pass';
              SELECT 'CREATE DATABASE ragapi OWNER ragapi'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'ragapi')\gexec
              SQL
              psql -v ON_ERROR_STOP=1 -d ragapi \
                -c "CREATE EXTENSION IF NOT EXISTS vector CASCADE;"
              psql -v ON_ERROR_STOP=1 -d ragapi \
                -c "GRANT USAGE, CREATE ON SCHEMA public TO ragapi;"
              echo "ragapi role/database/pgvector ready"
