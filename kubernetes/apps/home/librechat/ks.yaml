---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-home-librechat
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/enabled: "true"
spec:
  dependsOn:
    # LibreChat needs its MongoDB instance to be reconciled first. The
    # mongodb-kubernetes operator + MongoDBCommunity instance live in
    # kubernetes/apps/databases/mongodb-kubernetes/.
    - name: cluster-databases-mongodb-instances
  path: ./kubernetes/apps/home/librechat
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2beta1
      kind: HelmRelease
      name: librechat
      namespace: home
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      # Self-referential on purpose: strict-mode substitution requires every
      # ${VAR} to be defined. Substituting this var with its own literal
      # leaves the rendered HelmRelease values with a single literal
      # ${THEKAO_AI_API_KEY}, which LibreChat's extractEnvVariable() then
      # resolves from process.env at request time. The real key lives in the
      # SOPS-encrypted Secret injected as pod env and never renders to disk.
      THEKAO_AI_API_KEY: "${THEKAO_AI_API_KEY}"
