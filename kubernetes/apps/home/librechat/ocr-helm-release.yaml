# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app librechat-ocr
  namespace: home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"

    controllers:
      main:
        type: deployment
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            # paperless-ngx image = stock build that ships tesseract-ocr +
            # poppler-utils (pdftoppm) + python3. We only borrow its
            # filesystem — nothing paperless runs here. Command runs the
            # Mistral-OCR-compatible shim (see ocr-shim-configmap.yaml).
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.2.1
            command:
              - python3
              - /shim/shim.py
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: "2"
                memory: 2Gi

    service:
      main:
        primary: true
        ports:
          http:
            port: 8080

    persistence:
      shim:
        type: configMap
        name: librechat-ocr-shim
        defaultMode: 0755
        globalMounts:
          - path: /shim/shim.py
            subPath: shim.py
            readOnly: true
