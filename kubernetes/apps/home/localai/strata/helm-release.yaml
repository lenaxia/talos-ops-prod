# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname strata
  namespace: &namespace home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    timeout: 30m
    remediation:
      retries: 2
  upgrade:
    timeout: 30m
    remediation:
      retries: 2
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "special"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
    controllers:
      app:
        type: deployment
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: ghcr.io/niko1221/strata
              tag: 0.2.12-cuda13
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: FAMILY
                value: qwen
              - name: MODEL
                value: IQ3_S
              # model GGUFs are pre-downloaded on the shared PVC — no engine download
              - name: MODEL_PATH
                value: /models
              - name: API_KEY
                value: local-benchmark
              - name: NVIDIA_VISIBLE_DEVICES
                value: "GPU-52d95ccc-2df5-7179-ad4a-e7b280f04822,GPU-ec4bf65c-4e9e-b857-11e7-bcc716f11d93" # 2x 4090 48GB
              - name: NVIDIA_DRIVER_CAPABILITIES
                value: compute,utility
              # recipe flags from the 2x3090 community recipe + thread consensus
              - name: STRATA_HC_Q8
                value: "1"
              - name: STRATA_ROUTE_TAIL_SKIP
                value: "0"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 30
                  failureThreshold: 40
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 30
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 15
                  failureThreshold: 5
            resources:
              requests:
                cpu: "8"
                memory: 32Gi
                nvidia.com/gpu: "2"
              limits:
                # 2026-11-07: no memory limit — Strata plans from host RAM
                # (/proc/meminfo); a 64Gi limit killed the load (upstream warns).
                nvidia.com/gpu: "2"
    persistence:
      models:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: qfn-vllm
        globalMounts:
          - path: /models
      data:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /data
    service:
      app:
        ports:
          http:
            port: 8080
        primary: true
        type: ClusterIP
