# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname vllm
  namespace: &namespace home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    timeout: 60m
    remediation:
      retries: 2
  upgrade:
    timeout: 60m
    remediation:
      retries: 2
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: 'true'
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "special"
          effect: "NoSchedule"
    controllers:
      app:
        type: deployment
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: vllm/vllm-openai
              # renovate: depName=vllm/vllm-openai
              tag:
                v0.28.0-cu129-ubuntu2404@sha256:56b291b6179fe5e6e6ad5c509d362e745280ccdbe81ecbc0f5155b1cab0ebfc5
            command: ["/bin/sh", "-c"]
            args:
              - |
                vllm serve \
                    Qwen/Qwen3.8-27B-FP8 \
                    --served-model-name qwen3 \
                    --dtype auto \
                    --max-model-len 131072 \
                    --gpu-memory-utilization 0.97 \
                    --tensor-parallel-size 1 \
                    --max-num-seqs 2 \
                    --limit-mm-per-prompt '{"image":2,"video":1}' \
                    --trust-remote-code \
                    --host 0.0.0.0 \
                    --enable-chunked-prefill \
                    --enable-prefix-caching \
                    --kv-cache-dtype fp8 \
                    --enable-auto-tool-choice \
                    --tool-call-parser qwen3_coder \
                    --reasoning-parser qwen3 \
                    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
                    --default-chat-template-kwargs '{"enable_thinking":false}' \
                    --port 8000
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: NVIDIA_VISIBLE_DEVICES
                value: "GPU-ec4bf65c-4e9e-b857-11e7-bcc716f11d93" # 4090 48GB
              - name: PYTORCH_CUDA_ALLOC_CONF
                value: "expandable_segments:True,max_split_size_mb:512"
            envFrom:
              - secretRef:
                  name: *appname
            probes:
              # Qwen3.8-27B-FP8 on the 4090 takes ~8.5 min to reach HTTP-ready
              # (torch.compile + CUDA graph capture + MTP draft graphs). The old
              # initialDelaySeconds: 600 on liveness/readiness raced the
              # Deployment progressDeadlineSeconds: 600 — healthy-but-slow
              # rollouts were declared Failed and roll-backed (flux flap, which
              # also GC'd the pods before --previous logs could be captured).
              # Startup probe owns the slow-boot window (up to 20 min); readiness
              # and liveness are gated on startup success, so their delays drop.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 30
                  failureThreshold: 40
                  timeoutSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  successThreshold: 1
                  failureThreshold: 5
                  timeoutSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  successThreshold: 1
                  failureThreshold: 5
                  timeoutSeconds: 10
            resources:
              # Requests sized to observed peaks (VictoriaMetrics 17d, all pod
              # generations): steady RSS ~4.9Gi but every pod start spikes to
              # ~18.7Gi (model load + torch.compile + CUDA graph capture +
              # MTP draft graphs). Request 20Gi covers the spike — usage never
              # exceeds request, so no overcommit on worker-04; limit stays
              # 24Gi. LLMSafeSpaces#1244 context. Do NOT drop the request
              # below ~19Gi without re-measuring startup peaks.
              requests:
                cpu: 100m
                memory: 20Gi
                nvidia.com/gpu: "1"
              limits:
                memory: 24Gi
                nvidia.com/gpu: "1"

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 50Gi
        globalMounts:
          - path: /root/.cache/huggingface
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Gi
        globalMounts:
          - path: /dev/shm
    service:
      app:
        ports:
          http:
            port: 8000
        primary: true
        type: LoadBalancer
    # podSecurityContext:
    #   runAsUser: 1000
    #   runAsGroup: 1000
    #   fsGroup: 1000
    #   fsGroupChangePolicy: "OnRootMismatch"
