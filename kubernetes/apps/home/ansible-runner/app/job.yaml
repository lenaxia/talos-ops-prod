---
apiVersion: batch/v1
kind: Job
metadata:
  name: ansible-runner
  namespace: home
  annotations:
    ansible.talos-ops/revision: "ccc66dff"
spec:
  template:
    metadata:
      annotations:
        ansible.talos-ops/revision: "ccc66dff"
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 600
      containers:
        - name: ansible
          image: python:3.12-slim
          workingDir: /workspace
          command: ["/bin/bash", "/scripts/entrypoint.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: ansible-cfg
              mountPath: /etc/ansible/ansible.cfg
              subPath: ansible.cfg
              readOnly: true
            - name: secret
              mountPath: /secret
              readOnly: true
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: scripts
          configMap:
            name: ansible-runner
            defaultMode: 0755
            items:
              - key: entrypoint.sh
                path: entrypoint.sh
        - name: ansible-cfg
          configMap:
            name: ansible-runner
            items:
              - key: ansible.cfg
                path: ansible.cfg
        - name: secret
          secret:
            secretName: ansible-runner
        - name: workspace
          emptyDir: {}
