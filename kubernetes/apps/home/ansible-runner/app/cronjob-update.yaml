---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ansible-update
  namespace: home
spec:
  schedule: "0 3 1 * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          activeDeadlineSeconds: 900
          serviceAccountName: ansible-runner
          containers:
            - name: ansible
              image: python:3.15-slim
              command: ["/bin/bash", "/scripts/update-entrypoint.sh"]
              env:
                # Pushover high-priority alert on update failure — injected
                # via Flux postBuild substitution from cluster-secrets.
                - name: PUSHOVER_TOKEN
                  value: "${SECRET_PUSHOVER_PROD_TOKEN}"
                - name: PUSHOVER_USER_KEY
                  value: "${SECRET_PUSHOVER_USER_KEY}"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: secret
                  mountPath: /secret
                  readOnly: true
                - name: workspace
                  mountPath: /workspace
          volumes:
            - name: scripts
              configMap:
                name: ansible-runner
                defaultMode: 0755
                items:
                  - key: update-entrypoint.sh
                    path: update-entrypoint.sh
            - name: secret
              secret:
                secretName: ansible-runner
            - name: workspace
              emptyDir: {}
