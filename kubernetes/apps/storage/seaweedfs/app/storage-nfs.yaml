---
# Static NFS storage for SeaweedFS, following the repo's minio-nfs pattern:
# fake "nfs" provisioner StorageClass + hand-made PV bound by name/size/modes.
# Sizes are nominal (1Mi) - real capacity is the free space of each Synology
# volume, which SeaweedFS watches via minFreeSpacePercent.
#
# Tiers:
#   /volume3/s3-ssd  -> SSD pool (Synology volume3)
#   /volume1/s3-hdd  -> HDD pool (Synology volume1, SHR2)
#   /volume1/backups/seaweedfs -> filer catalog backup #2 (NFS copy)
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: seaweedfs-ssd-nfs
provisioner: nfs
parameters:
  archiveOnDelete: "false"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seaweedfs-ssd
spec:
  capacity:
    storage: 1Mi # Size does not matter
  accessModes:
    - ReadWriteMany
  storageClassName: seaweedfs-ssd-nfs
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: ${NAS_ADDR}
    path: ${NFS_SEAWEED_SSD}
  mountOptions:
    - nfsvers=3
    - nconnect=8
    - hard
    - noatime
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: seaweedfs-hdd-nfs
provisioner: nfs
parameters:
  archiveOnDelete: "false"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seaweedfs-hdd
spec:
  capacity:
    storage: 1Mi # Size does not matter
  accessModes:
    - ReadWriteMany
  storageClassName: seaweedfs-hdd-nfs
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: ${NAS_ADDR}
    path: ${NFS_SEAWEED_HDD}
  mountOptions:
    - nfsvers=3
    - nconnect=8
    - hard
    - noatime
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: seaweedfs-meta-nfs
provisioner: nfs
parameters:
  archiveOnDelete: "false"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seaweedfs-meta
spec:
  capacity:
    storage: 1Mi # Size does not matter
  accessModes:
    - ReadWriteMany
  storageClassName: seaweedfs-meta-nfs
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: ${NAS_ADDR}
    path: ${NFS_SEAWEED_META}
  mountOptions:
    - nfsvers=3
    - nconnect=8
    - hard
    - noatime
---
# Claim for the NFS catalog backup pod (meta-backup-nfs.yaml).
# The ssd/hdd tier claims are created by the chart's StatefulSet
# (volumeClaimTemplates) and bind to the PVs above.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-meta-nfs
  namespace: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: seaweedfs-meta-nfs
  resources:
    requests:
      storage: 1Mi # Size does not matter
