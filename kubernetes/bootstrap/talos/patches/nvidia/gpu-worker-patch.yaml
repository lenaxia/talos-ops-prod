machine:
  kernel:
    modules:
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
        # KMS framebuffer handoff — required by Games on Whales (Wolf) and
        # any DRM render-node consumer. Verified already Y on worker-04
        # (2026-10-01); pinned here so it survives node upgrades/resets.
        parameters:
          - nvidia_drm_modeset=1
      - name: nvidia_modeset
      # Games on Whales virtual input devices. The module ships via the
      # `siderolabs/uinput` system extension (schematic 465efb88…, active on
      # worker-04 since 2026-10-02, node on v1.13.11) — the machine-config
      # entry below loads it at boot. Required for inputtino virtual gamepads/keyboards;
      # feeds the kube-system/uinput-device-plugin (squat.ai/uinput).      - name: uinput

  sysctls:
    net.core.bpf_jit_harden: 1

