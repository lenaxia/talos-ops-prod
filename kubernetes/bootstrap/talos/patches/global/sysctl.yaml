machine:
  sysctls:
    fs.inotify.max_user_watches: "1048576"
    fs.inotify.max_user_instances: "8192"
    net.core.rmem_max: "7500000"
    net.core.wmem_max: "7500000"
    vm.nr_hugepages: "1024"
    # Talos defaults this to 0 (unprivileged-userns hardening). Every gVisor
    # runsc sandbox creates its own user namespace, and clone(CLONE_NEWUSER)
    # past the cap returns ENOSPC — so gVisor could not start a SINGLE
    # sandbox on any worker (LLMSafeSpaces US-70 pool AC-13: "cannot create
    # gofer process: gofer: fork/exec /proc/self/exe: no space left on
    # device", every run; verified user.max_user_namespaces=0 on all four
    # workers 2026-09-03). 63154 is the standard distro default. Runtime
    # value already set cluster-wide on 2026-09-03 via privileged probe —
    # this patch makes it persist across reboots/config applies.
    # Trade-off: re-enables unprivileged userns (a known container-escape
    # primitive); acceptable here — nodes run known workloads only and the
    # dind runner set is already privileged.
    user.max_user_namespaces: "63154"
