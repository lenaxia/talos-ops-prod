---
- name: Apply base fleet configuration
  hosts: all
  gather_facts: true
  roles:
    - role: base
      tags: [base]

# DNS nodes are configured one at a time: a node must pass its post-apply
# health check (roles/dns/tasks/verify.yaml) before the next node is
# touched. The role also refuses to start if a sibling resolver is down.
- name: Apply DNS configuration (one node at a time)
  hosts: dns
  gather_facts: true
  serial: 1
  roles:
    - role: dns
      tags: [dns]
    - role: loadbalancer
      tags: [loadbalancer]

- name: Apply remaining fleet roles
  hosts: all
  gather_facts: true
  roles:
    - role: vpn
      tags: [vpn]
    - role: kiosk
      tags: [kiosk]
      when: "'kiosk' in group_names"

- name: Deploy Cloudflare workers (uptime monitor)
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: cloudflare
