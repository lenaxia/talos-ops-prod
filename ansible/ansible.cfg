[defaults]
inventory = inventory/hosts.yaml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = ansible.builtin.default
interpreter_python = auto_silent
forks = 10
timeout = 30
# Fleet runs tolerate Pis that are powered off / unreachable; only actual
# task failures on reachable hosts fail the run (exit code stays 0 for
# unreachable-only). The ansible-runner Job relies on this.
ignore_unreachable = True

[privilege_escalation]
become = True
become_method = sudo

[callback_default]
result_format = yaml
