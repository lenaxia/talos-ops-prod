---
- name: Set bootstrap DNS for initial resolution
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 1.1.1.1
      nameserver 9.9.9.9
    mode: "0644"

- name: Create blocky user
  ansible.builtin.user:
    name: blocky
    system: true
    home: "{{ blocky_install_dir }}"
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure blocky install directory exists
  ansible.builtin.file:
    path: "{{ blocky_install_dir }}"
    state: directory
    owner: blocky
    group: blocky
    mode: "0755"

- name: Download blocky binary
  ansible.builtin.get_url:
    url: "{{ blocky_binary_url }}"
    dest: "/tmp/blocky_{{ blocky_version }}.tar.gz"
    mode: "0644"

- name: Extract blocky binary
  ansible.builtin.unarchive:
    src: "/tmp/blocky_{{ blocky_version }}.tar.gz"
    dest: "{{ blocky_install_dir }}"
    remote_src: true
    owner: blocky
    group: blocky
    mode: "0755"

- name: Ensure blocky config directory exists
  ansible.builtin.file:
    path: "{{ blocky_config_dir }}"
    state: directory
    owner: blocky
    group: blocky
    mode: "0755"

- name: Deploy blocky config
  ansible.builtin.template:
    src: blocky-config.yml.j2
    dest: "{{ blocky_config_file }}"
    owner: blocky
    group: blocky
    mode: "0644"
  notify: Restart blocky

- name: Install blocky systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/blocky.service
    content: |
      [Unit]
      Description=Blocky DNS proxy
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=blocky
      Group=blocky
      ExecStart={{ blocky_install_dir }}/blocky --config {{ blocky_config_file }}
      Restart=on-failure
      RestartSec=5
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      NoNewPrivileges=yes

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Restart blocky

- name: Ensure blocky service is enabled and running
  ansible.builtin.service:
    name: blocky
    state: started
    enabled: true
