---
# Post-apply health gate for the node just modified. Runs after handlers
# (flushed by main.yaml) so the service has actually restarted.
# A failure here halts the serial play before any remaining DNS node is
# touched — one node may end up degraded, but never both.
#
# Delegates to the shared deep health check (_safety role): asserts SSH
# reachability, the blocky service is active AND enabled (survives reboot),
# DNS/53 is open, and the resolver returns a real answer for the health
# name — all probed from the controller so a firewalled-off node fails here.
- name: Deep health check (dns class)
  ansible.builtin.include_role:
    name: _safety
    tasks_from: health-check.yaml
  vars:
    safety_node_class: dns
    safety_health_dns_name: "{{ dns_health_check_name }}"
    safety_health_services:
      - "{{ 'blocky' if dns_backend == 'blocky' else 'AdGuardHome' }}"
