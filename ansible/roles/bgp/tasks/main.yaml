---
- name: Install FRR
  ansible.builtin.package:
    name: frr
    state: present

- name: Deploy FRR config
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: Restart frr

- name: Enable bgpd daemon
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: "^bgpd="
    line: "bgpd=yes"
  notify: Restart frr

- name: Ensure FRR service is enabled and running
  ansible.builtin.service:
    name: frr
    state: started
    enabled: true
